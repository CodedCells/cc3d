let zoom = 1;
let minZoom = 0.125;
let maxZoom = 2;
let lastTouchDistance = null;

function handleWheelZoom(event) {
    event.preventDefault();
    const zoomAmount = -event.deltaY * 0.001;
    zoom = Math.min(maxZoom, Math.max(minZoom, zoom + zoomAmount));
	resize();
}

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function handleTouchStart(event) {
    if (event.touches.length === 2) {
        lastTouchDistance = getTouchDistance(event.touches);
    }
	resize();
}

function handleTouchMove(event) {
    if (event.touches.length === 2) {
        event.preventDefault();
        const currentDistance = getTouchDistance(event.touches);
        if (lastTouchDistance !== null) {
            const distanceDelta = currentDistance - lastTouchDistance;
            zoom = Math.min(maxZoom, Math.max(minZoom, zoom + distanceDelta * 0.005));
        }
        lastTouchDistance = currentDistance;
    }
	resize();
}

function handleTouchEnd(event) {
    if (event.touches.length < 2) {
        lastTouchDistance = null;
    }
}

document.addEventListener('wheel', handleWheelZoom, { passive: false });
document.addEventListener('touchstart', handleTouchStart, { passive: false });
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);

	row = new Array(length).fill(11);

	ym = y % 32

function boardwalk(length, y) {
	row = new Array(length).fill(11);
	rowNav = new Array(length).fill(255);
	
	ym = y % 32
	for (var x = 0; x < length; x++) {
		xm = x % 32;
		if (y > 141 && y < 150) {// path inner
			if (y % 2 == 1 && (x+(y%4)) % 4 == 3) row[x] = 5;
			else row[x] = 4;
		}
		else if (y > 137 && y < 154) {
			row[x] = 2;
			if ([139, 140, 151, 152].includes(y))
				row[x] = [2, 8][+(x%2 == y%2 && 13 > x%16 && x%16 > 8)];
		}
		else if (y > 131 && y < 160) row[x] = 1;
		else if (ym < 4 || xm < 4) row[x] = 16 + x%2;// planks
		else if (x > 224 && y > 192 && y < 224) {// grass
			row[x] = 1;
			rowNav[x] = 0;
		}
		else if (ym < 6) row[x] = 18 + (ym-4);// struts
		if (row[x] != 11 && row[x] != 18 && row[x] != 19) rowNav[x] = 0;
		
		if (row[x] == 11 && xm == 4) row[x] = 26;
		else if (row[x] == 11 && xm == 31) row[x] = 27;
	}
	level.push(row);
	levelNav.push(rowNav);
}

window.addEventListener('resize', resize, true);

function inBox(x, y, b) {
	return (b[0] <= x && x <= b[1] && b[2] <= y && y <= b[3]);
}

var buttonsOn = true;

function newButts(event) {
	
	if (!buttonsOn) return;
	
	for (const key of Object.keys(keysHeld)) {
		keysHeld[key] = false;
	}
	
	if (event == undefined)
		return;
	
	event.preventDefault();
	
	controllerBB = controller.getBoundingClientRect();
	controllerScaleX = controllerBB.width / controller.width;
	controllerScaleY = controllerBB.height / controller.height;

	if (event.touches === undefined)// mousehack
		event.touches = [event];
	
    for (const touch of event.touches) {
		cursorX = Math.round((touch.clientX - controllerBB.x) / controllerScaleX);
		cursorY = Math.round((touch.clientY - controllerBB.y) / controllerScaleY);
		
		if (!showController) {
			state = inBox(cursorX, cursorY, [0, 12, 0, 12])
			if (state)
				showController = true;
			else
				continue;
		}
		
        for (var key of Object.keys(controllerButtons)) {
			cdx = controllerButtons[key];
			cdx = [cdx[0], cdx[0]+cdx[2], cdx[1], cdx[1]+cdx[3]];
			if (inBox(cursorX, cursorY, cdx)) {
				if (key.includes("_")) {
					key = key.split("_")
					regularInput({code: key[0], fake:true}, true);
					regularInput({code: key[1], fake:true}, true);
				}
				else regularInput({code: key, fake:true}, true);
			}
		}
    }
}

function getDisplay() {
	controller = document.getElementById("controller");
	
	controller.addEventListener("mousemove", newButts, false);
	controller.addEventListener("mouseleave", newButts, false);
	controller.addEventListener("mousedown", newButts, false);
	
	controller.addEventListener('touchstart', newButts);
	controller.addEventListener('touchmove', newButts);
	controller.addEventListener('touchend', newButts);
	
	con = controller.getContext("2d");
	
	canvas = document.getElementById("display");
	ctx = canvas.getContext("2d");
	
	// turn off image aliasing
	ctx.msImageSmoothingEnabled = false;
	ctx.mozImageSmoothingEnabled = false;
	ctx.webkitImageSmoothingEnabled = false;
	ctx.imageSmoothingEnabled = false;
}

function resize() {
	getDisplay();
	
	var w = window.innerWidth;
	var h = window.innerHeight;

	aspectf = w/h;
	if (aspectf >= 1) {// landscape
		pWidth = Math.round((aspectf * bHeight - bWidth) / 2);
		pHeight = 0;
	} else {// portrait
		pWidth = 0;
		pHeight = Math.round((h/w * bWidth - bHeight) / 2);
	}

	// Change here: scale the canvas resolution by zoom
	canvas.width = (pWidth*2 + bWidth) / zoom;
	canvas.height = (pHeight*2 + bHeight) / zoom;
	
	pWidth = (canvas.width - bWidth) / 2;
	pHeight = (canvas.height - bHeight) / 2;
}

function posMod(i, m) {
	i %= m;
	if (i < 0) i += m;
	return i;
}


const animatedTiles = {
};

function drawTile(x, y, i) {
	tileX = (i % 16) * 8;
	tileY = Math.floor(i / 16) * 8;
	mapCon.drawImage(sprites, tileX, tileY, tileSize, tileSize, x*tileSize, y*tileSize, tileSize, tileSize);
}

function updateWorld(animateOnly, fx, fy, tx, ty) {
	
	if (fx == undefined) {
		fx = 0;
		fy = 0;
		tx = levelWidth;
		ty = levelHeight
	}
	
	const lastFrame = Math.floor(lastLastTime / 600);
	const frame = Math.floor(lastTime / 600);
	
	var tilesToUpdate = {};
	
	let lastTileFrame = 0;
	let newTileFrame = 0;
	
	for (var i of Object.keys(animatedTiles)) {
		lastTileFrame = lastFrame % animatedTiles[i].length;
		newTileFrame = frame % animatedTiles[i].length;
		if (lastTileFrame != newTileFrame)
			tilesToUpdate[i] = animatedTiles[i][newTileFrame];
	}
	
	for (var y = fy; y < ty; y++) {
		for (var x = fx; x < tx; x++) {
			let i = level[y%levelHeight][x%levelWidth];
			
			if (tilesToUpdate[i])
				i = tilesToUpdate[i];
			
			else if (animateOnly)
				continue;
			
			//if ((x%2 == y%2) == frame)
			//	continue;
			
			drawTile(x%levelWidth, y%levelHeight, i);
		}
	}
}


function drawWorld() {
    ctx.save();
    
    fx = posMod(Math.floor((scrollX - pWidth) / 8 - 8), levelWidth);
    fy = posMod(Math.floor((scrollY - pHeight) / 8 - 8), levelHeight);
    tx = Math.ceil((bWidth + pWidth + pWidth) / 8) + fx + 16;
    ty = Math.ceil((bHeight + pHeight + pHeight) / 8) + fy + 16;
    //updateWorld(true, fx, fy, tx, ty);

    var offsetX = -posMod(Math.floor(scrollX - pWidth), mapCanvas.width);
    var offsetY = -posMod(Math.floor(scrollY - pHeight), mapCanvas.height);

    while (offsetX < bWidth + pWidth + pWidth) {
        while (offsetY < bHeight + pHeight + pHeight) {
            ctx.drawImage(mapCanvas, offsetX, offsetY, mapCanvas.width, mapCanvas.height);
            offsetY += mapCanvas.height;
        }
        offsetX += mapCanvas.width;
        offsetY = -posMod(Math.floor(scrollY - pHeight), mapCanvas.height);
    }
    ctx.restore();
	
	ctx.fillStyle = "#121215";
	ctx.globalCompositeOperation = "lighten";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	ctx.globalCompositeOperation = "source-over";
}

function drawObjectBig(name, data, spriteX, spriteY) {
	//ctx.fillRect(spriteX, spriteY, 2, 2);// debug pos
	
	let bsData = bigSpriteIndex[data.bigSprite];
	if (bsData === undefined)
		bsData = [0, 0, 8, 8, 1]
	
	let [graphicX, graphicY, graphicW, graphicH, frames] = bsData;
	
	if (data.moving)
		data.sprite = Math.floor(lastTime / 300) % frames;
	else
		data.sprite = 0;
	
	graphicOffX = Math.floor(graphicW/2);
	graphicOffY = Math.floor(graphicH);
	
	if (data.facing == "down" || frames == 0)
		null;
	else if (data.facing == "left")
		graphicX += (graphicW + 1);
	else if (data.facing == "right")
		graphicX += (graphicW + 1) * 2;
	else if (data.facing == "up")
		graphicX += (graphicW + 1) * 3;
	
	if (data.sprite != 2)
		if (data.sprite == 1)
			graphicX += (graphicW + 1) * 4
		else if (data.sprite == 3)
			graphicX += (graphicW + 1) * 8
	
	ctx.drawImage(bigSprites,
		graphicX, graphicY,
		graphicW, graphicH,
		Math.floor(spriteX-graphicOffX), Math.floor(spriteY-graphicOffY),
		graphicW, graphicH,
	);
}

function drawObject(name, data) {
	if (data.draw === false) return // skip things we shouldn't draw
	
	var spriteX = Math.floor(data.x - (scrollX - pWidth));
	var spriteY = Math.floor(data.y - (scrollY - pHeight));
	
	var spritAlpha = 1;
	if (data.alpha !== undefined)
		spritAlpha = data.alpha;
	
	if (data.shadow !== false) {
		var shadowX = spriteX - 8;
		var shadowY = spriteY - 4;
		ctx.globalAlpha = Math.max(0, 0.4 - data.z / 100);
		ctx.drawImage(sprites, 64, 8, 16, 8, shadowX, shadowY, data.size, data.size/2);
		ctx.globalAlpha = spritAlpha;
	}
	if (keysHeld.KeyZ && data.goals && data.goals.length > 0 && data.goals[0].x !== undefined) {
		ctx.beginPath(); // Start a new path
		ctx.setLineDash([2, 6]);
		ctx.moveTo(spriteX+4, spriteY+4);
		
		for (var g = 0; g < data.goals.length; g++) {
			ctx.lineTo(
				Math.floor((data.goals[g].x * 8) + 4 - (scrollX - pWidth)),
				Math.floor((data.goals[g].y*8) + 4 - (scrollY - pHeight)));
		}
		ctx.strokeStyle = data.debugcolor;
		ctx.stroke();
	}
	
	spriteY -= data.z;
	
	if (data.drawFunction !== undefined) {
		data.drawFunction(name, data, spriteX, spriteY)
		return;
	}
	
	// sprites are stored 16 across, each 8x8
	var graphicX = (data.sprite % 16) * 8;
	var graphicY = Math.floor(data.sprite / 16) * 8;
	if (data.flip && name != "player") {// canvases cannot draw flipped images
		graphicX += 64;
	}
	/* // show offscrren guys at edges
	if (spriteX < 0) spriteX = -2;
	else if (spriteX > canvas.width) spriteX = canvas.width-6;
	
	if (spriteY < 0) spriteY = -2;
	else if (spriteY > canvas.height) spriteY = canvas.height-6;
	*/
	ctx.drawImage(sprites,
		graphicX, graphicY,
		data.size, data.size,
		spriteX, spriteY,
		data.size, data.size
	);
}

function inboundsTile(x, y) {
	return level[posMod(y, levelHeight)][posMod(x, levelWidth)];
}

function canMove(srcX, srcY, diffX, diffY) {
    
	var canX = true;
	var canY = true;
	
	var hits = []
    // Check if the target tile is not blocked (i.e., not 255)
    for (let y = -2; y < 0; y++) {
        for (let x = -1; x < 1; x++) {
			hits.push(colliders.includes(inboundsTile(
					Math.round(srcX+diffX+x),
					Math.round(srcY+diffY+y)
					)));
        }
    }
	if (hits.reduce((a, b) => a + b, 0) == 0)
		return [canX, canY];
	
	/*
	if (hits.slice(0,3).reduce((a, b) => a + b, 0) < 2 && diffY < 0)
		return [false, canY];
	else if (hits.slice(6,9).reduce((a, b) => a + b, 0) < 2 && diffY > 0)
		return [false, canY];
	if ([hits[0], hits[3], hits[6]].reduce((a, b) => a + b, 0) < 2 && diffX < 0)
		return [canX, false]
	if ([hits[2], hits[5], hits[8]].reduce((a, b) => a + b, 0) < 2 && diffX > 0)
		return [canX, false]
	*/
	
    return [false, false];
}

function moveFollower(delta, name, index, space, playerMoving) {
	if (!(name in objects)) return space;
	
	const me = objects[name];
	
	let personal_space = 24;
	if (me.bigSprite != undefined)
		if (bigSpriteIndex[me.bigSprite][2] > 32);
			 personal_space = bigSpriteIndex[me.bigSprite][2];
	
	space += Math.floor(personal_space / 2);
	
	if (playerMoving) me.moving = true;
	if (!me.moving) return space + Math.floor(personal_space / 2);
	
	let targetX = objects.player.x;
	let targetY = objects.player.y;
	
	switch (objects.player.facing) {
		case "right": targetX -= space; break;
		case "left": targetX += space; break;
		case "down": targetY -= space; break;
		case "up": targetY += space; break;
	}
	
	// Calculate difference
	const dx = targetX - me.x;
	const dy = targetY - me.y;
	
	if (dx > 0)			me.facing = "right";
	else if (dx < 0)	me.facing = "left";
	if (dy > 1)			me.facing = "down";
	else if (dy < -1)	me.facing = "up";
	
	// Compute distance to target
	const distance = Math.sqrt(dx * dx + dy * dy);
	
	// If close enough, snap to target
	if (distance < (0.5*delta)) {
		me.x = targetX;
		me.y = targetY;
	} else {
		// Calculate movement step (64 * delta) in direction of target
		const moveDist = 0.4 * delta;
		const moveX = (dx / distance) * moveDist;
		const moveY = (dy / distance) * moveDist;

		// Update position
		me.x += moveX;
		me.y += moveY;
	}
	
	if (!playerMoving) me.moving = false;
	
	return space + Math.floor(personal_space / 2);
}

function getNearbyObjects(objects, threshold = 10) {
	const nearby = [];
	const player = objects.player;

	for (let key in objects) {
		if (key === 'player') continue;

		const obj = objects[key];
		const dx = Math.abs(obj.x - player.x);
		const dy = Math.abs(obj.y - player.y);

		if (dx <= threshold && dy <= threshold) {
			nearby.push(key);
		}
	}

	return nearby;
}

// chaser logic

class Node {
    constructor(x, y, g, h, parent = null) {
        this.x = x;
        this.y = y;
        this.g = g; // Cost from start to this node
        this.h = h; // Heuristic cost from this node to goal
        this.f = g + h; // Total cost
        this.parent = parent;
    }
}

function aStarPathfinder(grid, start, end, iterationLimit) {
    const openList = [];
    const closedList = [];
    
    const startNode = new Node(start.x, start.y, 0, heuristic(start, end));
    openList.push(startNode);
    
	let iterations = 0;
    while (openList.length > 0) {
	
		if (iterations >= iterationLimit) {
            //console.log('Iteration limit reached');
            return [];
        }

        // Get the node with the lowest f value
        openList.sort((a, b) => a.f - b.f);
        const currentNode = openList.shift();
        
        if (currentNode.x === end.x && currentNode.y === end.y) {
            return constructPath(currentNode);
        }
        
        closedList.push(currentNode);
        
        // Get neighbors
        const neighbors = getNeighbors(currentNode, grid);
        for (let neighbor of neighbors) {
            if (closedList.some(node => node.x === neighbor.x && node.y === neighbor.y)) {
                continue;
            }
            
            const tentativeG = currentNode.g + getCost(grid, currentNode, neighbor);
            let neighborNode = openList.find(node => node.x === neighbor.x && node.y === neighbor.y);
            
            if (!neighborNode) {
                neighborNode = new Node(neighbor.x, neighbor.y, tentativeG, heuristic(neighbor, end), currentNode);
                openList.push(neighborNode);
            } else if (tentativeG < neighborNode.g) {
                neighborNode.g = tentativeG;
                neighborNode.f = neighborNode.g + neighborNode.h;
                neighborNode.parent = currentNode;
            }
        }
		
		iterations++;
		
    }
    
    return []; // No path found
}

function heuristic(pos0, pos1) {
    // Using Manhattan distance as heuristic
    return Math.abs(pos0.x - pos1.x) + Math.abs(pos0.y - pos1.y);
}

function getNeighbors(node, grid) {
    const neighbors = [];
    const directions = [
        {x: 0, y: -1}, {x: 0, y: 1},  // vertical
        {x: -1, y: 0}, {x: 1, y: 0},  // horizontal
        {x: -1, y: -1}, {x: 1, y: 1}, // diagonal
        {x: -1, y: 1}, {x: 1, y: -1}  // diagonal
    ];
    
    for (let dir of directions) {
        const newX = node.x + dir.x;
        const newY = node.y + dir.y;
        
		const lx = posMod(newX, levelWidth);
		const ly = posMod(newY, levelHeight);
		
		if (grid[ly][lx] !== 255) {
			neighbors.push({x: newX, y: newY});
		}
    }
    
    return neighbors;
}

function getCost(grid, currentNode, neighborNode) {
    // Increase the cost for diagonal movement
    const isDiagonal = Math.abs(currentNode.x - neighborNode.x) === 1 && Math.abs(currentNode.y - neighborNode.y) === 1;
	var baseCost = 1;
	
	const lx = posMod(neighborNode.x, levelWidth);
	const ly = posMod(neighborNode.y, levelHeight);
	
	var baseCost = grid[ly][lx] > 1 ? grid[ly][lx] : 1;
    return baseCost + (isDiagonal ? 1 : 0); // Add extra cost for diagonal movement
}

function constructPath(node) {
    const path = [];
    while (node) {
        path.push({x: node.x, y: node.y});
        node = node.parent;
    }
    return path.reverse();
}

function getPointOnCircle(centerX, centerY, radius, angleDegrees) {
	const angleRadians = angleDegrees * (Math.PI / 180); // Convert degrees to radians
	const x = centerX + radius * Math.cos(angleRadians);
	const y = centerY + radius * Math.sin(angleRadians);
	return [x, y];
}

function moveChaser(name, data, delta, canNav) {
	var me = data;
	var generatedNav = false;
	
	if (me.goals == undefined)
		me.goals = [];
	
	if (keysHeld["KeyH"]) {
		me.x = Math.floor(objects.player.x);
		me.y = Math.floor(objects.player.y);
		me.deltaX = 0;
		me.deltaY = 0;
		me.goals = [];
		me.moving = false;
		return
	}
	
	else if (me.goals.length == 0) {
		const start = {
			x: Math.floor(me.x / 8),
			y: Math.floor(me.y / 8)};
		
		const target = {
			x: Math.round((playerNavPos[0]) / 8),
			y: Math.round((playerNavPos[1]) / 8)};
		
		if (start.x == target.x && start.y == target.y) {
			me.moving = false;
			return false;
		}
		
		if (!canNav) {
			me.moving = false;
			return false;
		}
		
		//console.log(name, start, target)
		
		me.goals = aStarPathfinder(
			levelNav,
			start,
			target,
			1000
			);
		if (me.goals.length > 20) me.goals.length = 20;
		generatedNav = true;
	}
	if (me.goals.length < 1 || me.goals[0].x === undefined) {
		me.goals.shift();
		return generatedNav;
	}
	nextX = me.goals[0].x * 8;
	nextY = me.goals[0].y * 8;
	
	var stepX = +me.x;
	var stepY = +me.y;
	
	me.speed = 0.2;
	
	if (nextX < me.x) {
		stepX -= me.speed * delta;
		me.facing = "left";
	}
	else if (nextX > me.x) {
		stepX += me.speed * delta;
		me.facing = "right";
	}
	if (nextY < me.y) {
		stepY -= me.speed * delta;
		me.facing = "up";
	}
	else if (nextY > me.y) {
		stepY += me.speed * delta;
		me.facing = "down";
	}
	
	if (Math.abs(nextX - me.x) < 1 || Math.abs(stepX - nextX) > Math.abs(me.x - nextX))
		me.x = nextX;
	else
		me.x = stepX;
	
	if (Math.abs(nextY - me.y) < 1 || Math.abs(stepY - nextY) > Math.abs(me.y - nextY))
		me.y = nextY;
	else
		me.y = stepY;
	
	me.moving = true;
	if (me.x == nextX && me.y == nextY) {
		me.goals.shift();
		me.steps++;
	}
	
	return generatedNav;
}

function moveChasers(delta) {
	
	numChasers = 0;
	
	var canNav = canPathfind * Math.max(3, Math.floor(Math.max(1,numChasers)/300));
	
	for (var key in objects) {
		if (!(key.startsWith("chaser")))
			continue
		
		if (objects.player.followers.includes(key))
			continue
		
		var didNav = moveChaser(key, objects[key], delta, canNav);
		if (didNav)
			canNav -= 1;
		numChasers++;
	}
}

	moveChasers(delta);
	
	ctx.globalAlpha = 1;
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	drawWorld();
	
	drawObjects();
	
	//if (menu)
	//	drawMenu(delta);
	
	drawController();
	
	if (keysHeld["KeyG"])
		if (keysHeld["ShiftLeft"])
			ctx.drawImage(bigSprites, -Math.floor(scrollX%bigSprites.width), -Math.floor(scrollY%bigSprites.height));
		else
			ctx.drawImage(sprites, -Math.floor(scrollX%sprites.width), 64-Math.floor(scrollY%sprites.height));
	
	if (border || keysHeld["KeyB"]) {
		ctx.globalAlpha = 0.25;
		ctx.fillStyle = "#000";
		ctx.fillRect(0, 0, pWidth, bHeight);
		ctx.fillRect(bWidth+pWidth, 0, pWidth, bHeight);
		ctx.fillRect(0, 0, bWidth, pHeight);
		ctx.fillRect(0, bHeight+pHeight, bWidth, pHeight);
	}
	
	requestAnimationFrame(draw);
}

let startCount = 0;
function start() {
	if (++startCount < assetCount)
		return;
	
	resize();
	play();
}

function play() {
	console.log("would play");
	
	updateWorld(false);
	requestAnimationFrame(draw);
}

var showController = true;

var keysHeld = {
	"ArrowLeft": false,
	"ArrowRight": false,
	"ArrowUp": false,
	"ArrowDown": false,
	"KeyC": false,
	"KeyQ": false
}

var alts = {
	"KeyA":"ArrowLeft",
	"KeyD": "ArrowRight",
	"KeyW": "ArrowUp",
	"KeyS": "ArrowDown"
}

function regularInput(e, s) {
	if (e.fake !== true && showController) {
		showController = false;
		newButts();
	}
	
	code = e.code;
	if (code in alts) code = alts[code];
	
	keysHeld[code] = s;
	if (code == "KeyP" && s) canPathfind = !canPathfind;
	if (code == "Enter" && s) {
		//menu = !menu;
		objects.player.followers = [];
	}
	if (code == "KeyQ" && s) {
		spawnChaserAt(Math.floor(scrollX/tileSize), Math.floor(scrollY/tileSize));
	}
}

document.onkeydown = function (e) {
    e = e || window.event;
	regularInput(e, true);
};
document.onkeyup = function (e) {
    e = e || window.event;
	regularInput(e, false);
};
</script>
</body>
