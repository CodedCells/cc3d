let zoom = 1;
let nextZoom = 1;
let minZoom = 0.125;
let maxZoom = 2;
let lastTouchDistance = null;

function clamp(v, lo, hi) {
	return v < lo ? lo : (v > hi ? hi : v);
}

function applyZoom(amount) {
	nextZoom = clamp(nextZoom + amount, minZoom, maxZoom);
}

function handleWheelZoom(event) {
	event.preventDefault();
	applyZoom(-event.deltaY * 0.001);
	resize();
}

function getTouchDistance(touches) {
	return Math.hypot(
		touches[0].clientX - touches[1].clientX,
		touches[0].clientY - touches[1].clientY);
}

function handleTouchStart(event) {
	if (event.touches.length === 2) {
		lastTouchDistance = getTouchDistance(event.touches);
	}
	resize();
}

function handleTouchMove(event) {
	if (event.touches.length === 2) {
		event.preventDefault();
		const currentDistance = getTouchDistance(event.touches);
		if (lastTouchDistance !== null)
			applyZoom((currentDistance - lastTouchDistance) * 0.005);
		lastTouchDistance = currentDistance;
	}
	resize();
}

function handleTouchEnd(event) {
	if (event.touches.length < 2) {
		lastTouchDistance = null;
	}
}

document.addEventListener('wheel', handleWheelZoom, { passive: false });
document.addEventListener('touchstart', handleTouchStart, { passive: false });
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);

async function playAudio(dataUri, pitchSemitones = 0, volume = 1.0) {
	await audioCtx.resume(); // resume after user gesture
	
	// Fetch + decode audio
	const response = await fetch(dataUri);
	const arrayBuffer = await response.arrayBuffer();
	const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
	
	// Create nodes
	const source = audioCtx.createBufferSource();
	const gainNode = audioCtx.createGain();
	
	source.buffer = audioBuffer;
	source.playbackRate.value = Math.pow(2, pitchSemitones / 12);
	gainNode.gain.value = volume;
	
	// Connect nodes: source -> gain -> destination
	source.connect(gainNode).connect(audioCtx.destination);
	
	// Play immediately
	source.start();
	
	// Return a Promise that resolves when playback finishes
	return new Promise(resolve => {
		source.onended = resolve;
	});
}

let goalTile = 55;

function mod(n, m) { // js modulo keeps signed
// whyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
	return ((n % m) + m) % m;
}

function isTrackAt(x, y, dx=0, dy=0) {
	if (x < 0 || y < 0) return {};
	if (x >= levelWidth || y >= levelHeight) return {};
	
	const tile = inboundsTile(x, y);
	let entryDirection = 0;
	if (dx == 1) entryDirection = 1;
	else if (dy == 1) entryDirection = 2;
	else if (dx == -1) entryDirection = 3;
	
	let valid = {
		tile: tile,
		direction: entryDirection
	};
	
	let carryOn = [
		9, 53, // regular track, croos
		51, 52, // red horiz, vert
		55, // goal
		/*44, 45, 46, 47,// switch track center corner*/
	];
	
	if (carryOn.includes(tile))
		return valid;
	
	switch (tile) {
		case 10:
			if (dy == 0) {return valid;}
			else {return {};}
		case 11:
			if (dx == 0) {return valid;}
			else {return {};}
		case 12:
			if (dx != 0) {valid.direction = 2; return valid;}
			else if (dy != 0) {valid.direction = 1; return valid;}
			else if (dx == dy && dx == 0) {return valid;}// hack
			else {return {};}
		case 13:
			if (dx != 0) {valid.direction = 2; return valid;}
			else if (dy != 0) {valid.direction = 3; return valid;}
			else if (dx == dy && dx == 0) {return valid;}// hack
			else {return {};}
		case 14:
			if (dx != 0) {valid.direction = 0; return valid;}
			else if (dy != 0) {valid.direction = 1; return valid;}
			else if (dx == dy && dx == 0) {return valid;}// hack
			else {return {};}
		case 15:
			if (dx != 0) {valid.direction = 0; return valid;}
			else if (dy != 0) {valid.direction = 3; return valid;}
			else if (dx == dy && dx == 0) {return valid;}// hack
			else {return {};}
	}
	
	for (var key in objects) {
		if (key.startsWith("switchTrack")) {
			data = objects[key];
			[tx, ty] = [data.x / 10, data.y/10];
			if(x < tx-1 || x > tx+1 || y < ty-1 | y > ty+1)
				continue;
			
			let myvalid = {
				tile: -1,
				direction: entryDirection,
				"switch": key
			}
			
			if (data.mode == "line") {
				rotation = mod(Math.round(data.rotation / 10) * 10, 180);
				
				if (dx != 0 && rotation == 0)
					return myvalid;
				if (dy != 0 && rotation == 90)
					return myvalid;
				
				if (tx != x || ty != y) {
					if (dy != 0 && rotation == 0)
						return myvalid;
					if (dx != 0 && rotation == 90)
						return myvalid;
				}
			}
			
			else if (data.mode == "bend") {
				rotation = mod(Math.round(data.rotation / 10) * 10, 360);
				
				if (tx == x && ty == y) {
					if (rotation % 90 != 0)
						return {"switch": key};
				
					let myfacing = Math.floor(rotation / 90);
					
					//console.log(rotation, entryDirection);
					
					let bendDirection = [
						[9,	9,	1,	0],
						[1,	9,	9,	2],
						[3,	2,	9,	9],
						[9,	0,	3,	9]
					][myfacing][entryDirection];
					/*
					myFacing					 entryDirection
					0: can enter from 2 -> 1 amd 3 -> 0
					1: can enter from 3 -> 2 and 0 -> 1
					2: can enter from 1 -> 2 and 0 -> 3
					3: can enter from 1 -> 0 and 2 -> 3
					*/
					if (bendDirection != 9) {
						myvalid.direction = bendDirection;
						return myvalid;
					}
				}
				else if (dy != 0)
					return myvalid;
				else if (dx != 0)
					return myvalid;
			}
			//return {"switch": key}
		}
	}
	
	return {};
}

function updateTrackSprite(x, y) {
	if (isTrackAt(x, y).tile == undefined) return;
	
	const northTrack = isTrackAt(x, y-1).tile != undefined;
	const eastTrack	= isTrackAt(x+1, y).tile != undefined;
	const southTrack = isTrackAt(x, y+1).tile != undefined;
	const westTrack	= isTrackAt(x-1, y).tile != undefined;
	
	if (!northTrack && eastTrack && !southTrack && westTrack)
		level[y][x] = 10;
	
	if (northTrack && !eastTrack && southTrack && !westTrack)
		level[y][x] = 11;
	
	if (!northTrack && eastTrack && southTrack && !westTrack)
		level[y][x] = 12;
	
	if (!northTrack && !eastTrack && southTrack && westTrack)
		level[y][x] = 13;
	
	if (northTrack && eastTrack && !southTrack && !westTrack)
		level[y][x] = 14;
	
	if (northTrack && !eastTrack && !southTrack && westTrack)
		level[y][x] = 15;
	
	if (northTrack && eastTrack && southTrack && westTrack)
		level[y][x] = 53;
}

function placeTrackAt(x, y, tile=9, update=false) {
	level[y][x] = tile;
	
	if (update) {
		updateTrackSprite(x, y);
		updateTrackSprite(x-1, y);
		updateTrackSprite(x+1, y);
		updateTrackSprite(x, y-1);
		updateTrackSprite(x, y+1);
	}
	worldNeedsUpading = true;
}

function placeButton(name, x, y, sprite, type, target, antlineHook= null) {
	buttonData = {
		x: x*10, y: y*10, z: 0,
		size: 10, type: type,
		sprite: sprite, moving: false, flip: false,
		target: target,
		antlineHook: antlineHook,
		renderPriority: 100
	}
	objects[name] = buttonData;
}

function placeSwitchTrack(name, x, y, rotation, mode, bx, by, bs=64, antlineHook=null) {// center position
	
	let spriteTiles = [
		[null, null, null],
		[null, null, null],
		[null, null, null]
	];
	
	let poweredRotation = rotation-90;
	
	if (mode.includes("cw"))
		poweredRotation = rotation+90;
	
	if (mode.includes("line")) {
		mode = "line";
		level[y-1][x-1] = 56;
		level[y-1][x] = 43;
		level[y-1][x+1] = 57;
		
		level[y][x-1] = 42;
		level[y][x] = 41;
		level[y][x+1] = 42;
		
		level[y+1][x-1] = 58;
		level[y+1][x] = 43;
		level[y+1][x+1] = 59;
		
		spriteTiles[1] = [26, 25, 26];
	
	} else if (mode.includes("Bend")) {
		mode = "bend";
		easyroation = rotation % 360;
		
		if ((easyroation >= 90 && easyroation <= 270) == mode.includes("cw")) {
			level[y-1][x-1] = 60;
			level[y-1][x] = 43;
			level[y-1][x+1] = 61;
		} else {
			level[y+1][x-1] = 62;
			level[y+1][x] = 43;
			level[y+1][x+1] = 63;
		}
		
		let spriterot = Math.round(easyroation / 90);
		spriterot = (spriterot + 3) % 4;
		
		level[y][x-1] = 42;
		level[y][x] = 44 + spriterot;
		level[y][x+1] = 42;
		
		spriteTiles[0][1] = 27;
		spriteTiles[1][1] = 30;
		spriteTiles[1][2] = 26;
	}
	
	switchData = {
		x: x*10, y: y*10, z: 0,
		rotation: rotation,
		defaultRotation: rotation+0,
		poweredRotation: poweredRotation,
		train: null, trainTimer: 0,
		mode: mode, spriteTiles: spriteTiles,
		size: 30, moving: false, flip: false,
		sprite: 0,
		drawFunction: drawObjectSwitch,
		renderPriority: -100,
	}
	
	placeButton(
		"buttonSwitch_" + name,
		bx, by, bs,
		"switchTrack", "switchTrack_" + name,
		antlineHook
	);
	
	objects["switchTrack_" + name] = switchData;
}

function placeTrackLoopSquare(x, y, s) {
	s--;
	for (let i = 0; i < s; i++) {
		placeTrackAt(i+x, y);
		placeTrackAt(x, i+y+1);
		placeTrackAt(s+x, i+y);
		placeTrackAt(i+1+x, s+y);
	}
	for (let i = 0; i < s; i++) {
		updateTrackSprite(i+x, y);
		updateTrackSprite(x, i+y+1);
		updateTrackSprite(s+x, i+y);
		updateTrackSprite(i+1+x, s+y);
	}
}

function placeTrackLoop(x, y, w, h) {
	if (w == h) return placeTrackLoopSquare(x, y, w);
	
	for (let ix = 0; ix < w-1; ix++) {
		placeTrackAt(x+ix, y);
		placeTrackAt(x+ix, y+h-1);
	}
	for (let iy = 0; iy < h; iy++) {
		placeTrackAt(x, y+iy);
		placeTrackAt(x+w-1, y+iy);
	}
	
	for (let ix = 0; ix < w-1; ix++) {
		updateTrackSprite(x+ix, y);
		updateTrackSprite(x+ix, y+h-1);
	}
	for (let iy = 0; iy < h; iy++) {
		updateTrackSprite(x, y+iy);
		updateTrackSprite(x+w-1, y+iy);
	}
}

function aplaceTrain(name, x, y, facing, cars, mode="", button=null) {
	let trainData = {
		x: x*10, y: y*10, z:0,
		size: 10, moving: button == null, flip: mode == "flip",
		sprite: 1 + facing,
		drawFunction: drawObjectTrain,
		renderPriority: 100,
		nextTarget: {x: null},
		visible: true,
		cars: []
	};
	
	direction = (facing + 2) % 4;
	
	let [dx, dy] = getDirectionDelta(direction);
	
	let [lastX, lastY] = [x, y];
	for (let i = 0; i < cars; i++) {
		lastX += dx;
		lastY += dy;
		
		dTrack = isTrackAt(lastX, lastY, dx, dy);
		if (dTrack.tile == undefined) {
			lastX -= dx;
			lastY -= dy;
			
			dTrack = isTrackAt(lastX, lastY, dx, dy);
			direction = dTrack.direction;
			[dx, dy] = getDirectionDelta(direction);
			lastX += dx;
			lastY += dy;
			
			facing = (direction + 2) % 4;
		}
		
		trainData.cars.push({x: lastX*10, y: lastY*10, sprite: 5 + facing, visible: true, nextTarget: {x: null}});
		
	}
	
	if (button !== null) {
		placeButton(
			"buttonTrain_" + name,
			button.x, button.y, button.sprite,
			button.type, "train_" + name,
			button.antlineHook
		);
	}
	
	
	objects["train_" + name] = trainData;
}

function placeTrain(name, x, y, facing, cars, mode="", button=null) {
	try {
		aplaceTrain(name, x, y, facing, cars, mode, button)
	} catch (error) {
		console.log("error on train: ", name);
		console.error(error);
	}
}

window.addEventListener('resize', resize, true);

function inBox(x, y, b) {
	return (b[0] <= x && x <= b[1] && b[2] <= y && y <= b[3]);
}

var buttonsOn = true;

function eButt(event) {
	if (event == undefined)
		return;
	
	event.preventDefault();
	
	gameBB = canvas.getBoundingClientRect();
	gameSX = gameBB.width / canvas.width;
	gameSY = gameBB.height / canvas.height;
	
	if (event.touches !== undefined)// mousehack
		return;
	
	event.touches = [event];

	// Detect mouse button(s)
	let left   = (event.buttons & 1) !== 0;
	let right  = (event.buttons & 2) !== 0;
	let middle = (event.buttons & 4) !== 0;

	// you can store these however your game uses them
	keysHeld["LeftMouse"] = left;
	keysHeld["RightMouse"] = right;
	keysHeld["MiddleMouse"] = middle;
	
	var offsetX = -(Math.floor(scrollX - pWidth));
	var offsetY = -(Math.floor(scrollY - pHeight));

	for (const touch of event.touches) {
		gameX = Math.round((touch.clientX - gameBB.x) / gameSX);
		gameY = Math.round((touch.clientY - gameBB.y) / gameSY);
		objects.cursor.x = gameX - offsetX;
		objects.cursor.y = gameY - offsetY;
	}
}

function newButts(event) {
	
	if (!buttonsOn) return;
	
	if (event == undefined)
		return;
	
	event.preventDefault();
	
	controllerBB = controller.getBoundingClientRect();
	controllerScaleX = controllerBB.width / controller.width;
	controllerScaleY = controllerBB.height / controller.height;

	if (event.touches === undefined)// mousehack
		event.touches = [event];
	
	hitKeys = [];
	for (const touch of event.touches) {
		cursorX = Math.round((touch.clientX - controllerBB.x) / controllerScaleX);
		cursorY = Math.round((touch.clientY - controllerBB.y) / controllerScaleY);
		
		if (!showController) {
			state = inBox(cursorX, cursorY, [0, 12, 64-12, 64])
			if (state)
				showController = true;
			else
				continue;
		}
		
		for (var key of Object.keys(controllerButtons)) {
			cdx = controllerButtons[key].slice(); // copy, so we don't mutate the shared array
			// I chased that bug so far man
			if (cdx[0] < 0)
				cdx[0] += controller.width;
			cdx = [cdx[0], cdx[0]+cdx[2], cdx[1], cdx[1]+cdx[3]];
			if (inBox(cursorX, cursorY, cdx)) {
				if (key.includes("_")) {
					key = key.split("_")
					regularInput({code: key[0], fake:true}, true);
					regularInput({code: key[1], fake:true}, true);
					hitKeys += key;
				}
				else {
					regularInput({code: key, fake:true}, true);
					hitKeys.push(key);
				}
			}
		}
	}
	if (showController) { // would also cuck keyboard if mouse is moving eww
		for (const key of Object.keys(keysHeld)) {
			if (!hitKeys.includes(key))
				keysHeld[key] = false;
		}
	}
}

function getDisplay() {
	controller = document.getElementById("controller");
	
	controller.addEventListener("mousemove", newButts, false);
	controller.addEventListener("mouseleave", newButts, false);
	controller.addEventListener("mousedown", newButts, false);
	
	controller.addEventListener('touchstart', newButts);
	controller.addEventListener('touchmove', newButts);
	controller.addEventListener('touchend', newButts);
	
	con = controller.getContext("2d");
	
	canvas = document.getElementById("display");
	ctx = canvas.getContext("2d");
	
	canvas.addEventListener("mousemove", eButt, false);
	canvas.addEventListener("mouseleave", eButt, false);
	canvas.addEventListener("mousedown", eButt, false);
	
	canvas.addEventListener('touchstart', eButt);
	canvas.addEventListener('touchmove', eButt);
	canvas.addEventListener('touchend', eButt);
	
	canvas.addEventListener("contextmenu", function (event) {event.preventDefault();
});
	
	// turn off image aliasing
	ctx.msImageSmoothingEnabled = false;
	ctx.mozImageSmoothingEnabled = false;
	ctx.webkitImageSmoothingEnabled = false;
	ctx.imageSmoothingEnabled = false;
}

function resize() {
	getDisplay();
	
	var w = window.innerWidth;
	var h = window.innerHeight;

	aspectf = w/h;
	if (aspectf >= 1) {// landscape
		pWidth = Math.round((aspectf * bHeight - bWidth) / 2);
		pHeight = 0;
		controller.width = 256;;
	} else {// portrait
		pWidth = 0;
		pHeight = Math.round((h/w * bWidth - bHeight) / 2);
		controller.width = 128;
	}

	// Change here: scale the canvas resolution by zoom
	canvas.width = pWidth*2 + bWidth;
	canvas.height = pHeight*2 + bHeight;
	
	pWidth = (canvas.width - bWidth) / 2;
	pHeight = (canvas.height - bHeight) / 2;
	
	canvas.width /= zoom;
	canvas.height /= zoom;
}

function getSpritePos(i) {
	tileX = (i % 16) * tileSize;
	tileY = Math.floor(i / 16) * tileSize;
	return [tileX, tileY];
}

function drawTile(x, y, i, animateOnly) {
	if (animateOnly && !worldNeedsUpading) {
		return;
	}
	if (i == 0) {
		mapCon.clearRect(x*tileSize, y*tileSize, 10, 10);
		return;
	}
	if (typeof i === 'string') {
		mapCon.fillStyle = i;
		mapCon.fillRect(x*tileSize, y*tileSize, 10, 10);
		return;
	}
	
	let [tileX, tileY] = getSpritePos(i);
	
	mapCon.drawImage(sprites, tileX, tileY, tileSize, tileSize, x*tileSize, y*tileSize, tileSize, tileSize);
}

function updateWorld(animateOnly, fx, fy, tx, ty) {
	
	if (fx == undefined) {
		fx = 0;
		fy = 0;
		tx = levelWidth;
		ty = levelHeight
	}
	
	if (worldNeedsUpading)
		mapCon.clearRect(fx, fy, tx*tileSize, ty*tileSize);
	
	for (var y = fy; y < ty; y++) {
		row = level[y%levelHeight];
		for (var x = fx; x < tx; x++) {
			drawTile(x%levelWidth, y%levelHeight, row[x%levelWidth], animateOnly);
		}
	}
	
	worldNeedsUpading = false;
}


function drawWorld() {
	fx = Math.max((Math.floor((scrollX - pWidth) / tileSize - tileSize)), 0);
	fy = Math.max((Math.floor((scrollY - pHeight) / tileSize - tileSize)), 0);
	tx = Math.ceil((bWidth + pWidth + pWidth) / tileSize) + fx + 16;
	ty = Math.ceil((bHeight + pHeight + pHeight) / tileSize) + fy + 16;
	updateWorld(true, fx, fy, tx, ty);

	var offsetX = -(Math.floor(scrollX - pWidth));
	var offsetY = -(Math.floor(scrollY - pHeight));

	ctx.drawImage(mapCanvas, offsetX, offsetY);
}

function drawObject(name, data) {
	if (data.draw === false) return // skip things we shouldn't draw
	
	var spriteX = Math.floor(data.x - (scrollX - pWidth));
	var spriteY = Math.floor(data.y - (scrollY - pHeight));
	
	var spriteAlpha = 1;
	if (data.alpha !== undefined)
		spriteAlpha = data.alpha;
	
	ctx.globalAlpha = spriteAlpha;
	spriteY -= data.z;
	
	let [graphicX, graphicY] = getSpritePos(data.sprite);
	
	if (data.target) {
		ctx.beginPath(); // Start a new path
		ctx.setLineDash([2, 3]);
		ctx.lineWidth = 2;
		ctx.moveTo(spriteX+5, spriteY+5);
		
		targetName = data.target;
		if (targetName in objects) {
			target = objects[targetName];
			let tx = Math.round(target.x + 5 - (scrollX - pWidth));
			let ty = Math.round(target.y + 5 - (scrollY - pHeight));
			
			if (target.x != data.x && target.y != data.y) {
				// mid point
				if (data.antlineHook)
					ctx.lineTo(tx, spriteY+5);
				else
					ctx.lineTo(spriteX+5, ty);
			}
			
			ctx.lineTo(tx, ty);
			
			ctx.strokeStyle = "#00FFFF";
			if (data.activated) {
				ctx.strokeStyle = "#F8941D";
			}
			ctx.stroke();
			ctx.setLineDash([]);
		}
	}
	
	if (data.drawFunction !== undefined) {
		data.drawFunction(name, data, spriteX, spriteY);
	} else {
	
		/* // show offscrren guys at edges
		if (spriteX < 0) spriteX = -2;
		else if (spriteX > canvas.width) spriteX = canvas.width-6;
		
		if (spriteY < 0) spriteY = -2;
		else if (spriteY > canvas.height) spriteY = canvas.height-6;
		*/
		ctx.drawImage(sprites,
			graphicX, graphicY, 
			data.size, data.size, 
			spriteX, spriteY,
			data.size, data.size
		);
	}
	
	if (false) {//data.nextTarget && data.nextTarget.x != null) {
		ctx.beginPath(); // Start a new path
		ctx.setLineDash([2, 6]);
		ctx.moveTo(spriteX+5, spriteY+5);
		
		target = data.nextTarget;
		
		ctx.lineTo(
			Math.floor(target.x + 5 - (scrollX - pWidth)),
			Math.floor(target.y + 5 - (scrollY - pHeight)));
		
		ctx.strokeStyle = "#ff00ff";
		ctx.stroke();
		ctx.setLineDash([]);
	}
}

function lerp(a, b, alpha) {
	return a + alpha * (b - a);
}

let lastX = 0;
let lastY = 0;
let lastMove = [0, 0];

function inboundsTile(x, y) {
	x = parseInt(x);
	y = parseInt(y);
	if (x < 0 || y < 0 || x >= levelWidth || y >= levelHeight)
		return -1;
	return level[y][x];
}

function findNearestValidPosition(x, y) {
	const currentTileX = Math.floor(x / tileSize);
	const currentTileY = Math.floor(y / tileSize);
	
	// Search in expanding squares around the current position
	for (let radius = 0; radius < Math.max(levelWidth, levelHeight); radius++) {
		for (let dy = -radius; dy <= radius; dy++) {
			for (let dx = -radius; dx <= radius; dx++) {
				// Only check positions on the current "square ring"
				if (Math.abs(dx) !== radius && Math.abs(dy) !== radius) continue;
				
				const checkX = currentTileX + dx;
				const checkY = currentTileY + dy;
				
				// Check if this position is valid
				if (!colliders.includes(inboundsTile(checkX, checkY))) {
					const testX = checkX * tileSize + (tileSize - 12) / 2;
					const testY = checkY * tileSize + (tileSize - 12) / 2;
					return [testX, testY];
				}
			}
		}
	}
	return [-1, -1];
}

function canMove(newX, newY) {
		
		// Check collision with map tiles
		const tileX = Math.floor(newX / tileSize);
		const tileY = Math.floor(newY / tileSize);
		
		// Check corners of player hitbox
		const corners = [
			[tileX, tileY], // Top-left
			[Math.floor((newX + 12) / tileSize), tileY], // Top-right
			[tileX, Math.floor((newY + 12) / tileSize)], // Bottom-left
			[Math.floor((newX + 12) / tileSize), Math.floor((newY + 12) / tileSize)] // Bottom-right
		];
	
		// Check if any corner collides with a wall
		const collision = corners.some(([x, y]) => colliders.includes(inboundsTile(x, y)));
		
		if (!collision) {
			return true;
		}
	return false;
}

function movePlayer(delta) {
	var move = [0, 0];
	if (keysHeld.ArrowUp) {
		move[1] = -1;
	}
	else if (keysHeld.ArrowDown) {
		move[1] = 1;
	}
	if (keysHeld.ArrowLeft) {
		move[0] = -1;
	}
	else if (keysHeld.ArrowRight) {
		move[0] = 1;
	}
	
	objects.player.moving = move[0] !== 0 || move[1] !== 0;
	
	var multiMove = 1;
	if (move[0] != 0 && move[1] != 0)
		multiMove = 0.7;
	
	playerDeltaX = move[0] * delta * multiMove * .2;
	playerDeltaY = move[1] * delta * multiMove * .2;
	
	canX = canMove(objects.player.x + playerDeltaX, objects.player.y);
	canY = canMove(objects.player.x, objects.player.y + playerDeltaY);
	canBoth = canMove(objects.player.x + playerDeltaX, objects.player.y + playerDeltaY);
	
	if (objects.player.z == 0) {
		if (!canBoth) {
			if (canX)
				playerDeltaY = 0;
			else if (canY)
				playerDeltaX = 0;
		}
	}
	
	if (objects.player.z > 0 || canMove(Math.round(objects.player.x + playerDeltaX), Math.round(objects.player.y + playerDeltaY))) {
		objects.player.x = Math.round(objects.player.x + playerDeltaX);
		objects.player.y = Math.round(objects.player.y + playerDeltaY);
	}
	
	if (objects.player.z > 0) {
		objects.player.z += objects.player.motionZ;
		objects.player.motionZ -= 0.5;
		if (objects.player.motionZ < -4)
			objects.player.motionZ = -2;
	} else {
		objects.player.z = 0;
		objects.player.motionZ = 0;
		if (keysHeld.Space) {
			objects.player.motionZ = 4;
			objects.player.z += objects.player.motionZ;
		}
	}
}

function getDirectionDelta(direction) {
	switch (direction) {
		case 0: // North
			return [0, -1];
		case 1: // East
			return [1, 0];
		case 2: // South
			return [0, 1];
		case 3: // West
			return [-1, 0];
		default:
			return [-1, -1];// error :3
	}
}

function getNewFacing(tile, oldFacing) {
	track = (tile - 12) % 4;
	
	if (tile < 12 || tile > 15)
		return oldFacing;
	
	return [
		[1, 1, 2, 2],// East/South
		[3, 2, 2, 3],// West/South
		[0, 1, 1, 0],// East/North
		[0, 0, 3, 3],// West/North
	][track][oldFacing];
}

function findNextTarget(x, y, facing) {
	let [dx, dy] = getDirectionDelta(facing);
	[x, y] = [Math.floor(x/10), Math.floor(y/10)];
	
	let [currentX, currentY] = [x, y];
	
	let newFacing = facing;
	
	while (true) {
		dTrack = isTrackAt(x+dx, y+dy, dx, dy);
		if (dTrack.tile == undefined)
			break;
		
		newFacing = dTrack.direction;
		
		x += dx;
		y += dy;
		tile = inboundsTile(x, y);
		if (tile == goalTile) {
			return {x: (x+dx)*10, y: (y+dy)*10, facing: newFacing};
		}
		if (facing != newFacing) {
			break;
		}
		
		if (dTrack.switch != undefined)
			break;
		
		break;
	}
	
	tile = inboundsTile(x, y);
	
	if (tile >= 12 && tile < 16) {// not sure why this is needed, but it stops some errors
		newFacing = getNewFacing(inboundsTile(x, y), facing);
	}
	else if (currentX == x && currentY == y) {// end of track
		return {x: null};
	}
	
	return {x: x * 10, y: y * 10, facing: newFacing};
}

function moveTowards(at, to, delta) {
	if (Math.abs(at - to)) {
		at += Math.sign(to - at) * delta;
		if (Math.abs(at - to) < 0.1)
			at = to;
	}
	return at;
}

function moveCar(name, data, sprite, flip, delta) {
	lastcar = false;
	if (sprite > 1) {
		lastcar = true;
		sprite--;
	}
	
	let facing = (data.sprite - 1) % 4;
	if (flip) facing = (facing + 2) % 4;
	
	if (data.x == data.nextTarget.x && data.y == data.nextTarget.y) {
		newFacing = (data.nextTarget.facing + (flip*2)) % 4
		data.sprite = newFacing + 1 + (sprite*4);
		data.nextTarget.x = null;
	}
	
	if (data.nextTarget.x == null) {
		facing = (data.sprite - 1) % 4;
		if (flip) facing = (facing + 2) % 4;
		
		data.nextTarget = findNextTarget(data.x, data.y, facing);
		
		if (data.nextTarget.x == null) {
			tile = inboundsTile(data.x/10, data.y/10);
			[dx, dy] = getDirectionDelta(facing);
			if (inboundsTile((data.x/10+dx), (data.y/10)+dy) == 54) // stop tracks
				return "stop";
			
			if (sprite == 0 && !flip)
				return 'flippled';
			else (lastcar && flip)
				return 'flippled';
		}
	}
	
	data.x = moveTowards(data.x, data.nextTarget.x, delta);
	data.y = moveTowards(data.y, data.nextTarget.y, delta);
	
	[dx, dy] = getDirectionDelta(facing);
	
	dTrack = isTrackAt(Math.floor(data.x/10), Math.floor(data.y/10), dx, dy);
	tile = inboundsTile(Math.floor(data.x/10), Math.floor(data.y/10));
	
	if (tile == goalTile) {
		data.visible = false;
	}
	
	if (dTrack.switch) {
		objects[dTrack.switch].train = name;
		objects[dTrack.switch].trainTimer = 300;
	}
	
	return false;
}

function moveTrain(name, data, delta) {
	if (!data.moving)
		return;
	
	//if (!keysHeld["KeyF"])
	//	return;
	
	delta /= 20;
	
	carAction = false;
	cardata = data;
	
	let lastPosX, lastPosY;
	
	for (var i = -1; i < data.cars.length; i++) {
		c = i;
		if (data.flip)
			c = data.cars.length - i - 2;
		
		carno = 0;
		
		cardata = data;
		if (c != -1) {
			cardata = data.cars[c];
			carno = 1;
		}
		if (c == data.cars.length)
			carno = 2;
		
		carAction = moveCar(name, cardata, carno, data.flip, delta);
		
		if (i > 0)
			if (Math.abs(lastPosX - cardata.x) > 20 || Math.abs(lastPosY - cardata.y) > 20) {
				spawnFailSafe(cardata.x, cardata.y);
				data.moving = false;
				cardata.dead = true;
				break;
			}
		
		[lastPosX, lastPosY] = [cardata.x, cardata.y];
		
		if (carAction == 'flippled') {
			data.nextTarget.x = null;
			break;
		} else if (carAction == "stop") {
			break;
		}
	}
	if (!cardata.visible) {
		// if last car is now invisible
		playAudio(sndWon, 0, 1);
		delete objects[name];
		return;
	}
	/*
	if (carAction == "stop") {
		data.moving = false;
		return;
	}
	*/
	if (carAction == 'flippled') {
		//data.moving = false;
		data.nextTarget.x = null;
		data.flip = !data.flip;
		for (var i = 0; i < data.cars.length; i++) {
			data.cars[i].nextTarget.x = null;
		}
	}
}

function doBoxesOverlap(box1, box2) {
	return !(box1.x + box1.width <= box2.x || // box1 is to the left of box2
		box1.x >= box2.x + box2.width || // box1 is to the right of box2
		box1.y + box1.height <= box2.y || // box1 is above box2
		box1.y >= box2.y + box2.height);	// box1 is below box2
}

function moveSwitchTrack(name, data, touching, delta) {
	let track = objects[data.target];
	
	if (track.train != null) {
		track.rotation = Math.round(track.rotation / 90) * 90;
		train = track.train;
		track.trainTimer -= delta;
		if (track.trainTimer > 0)
			return;
	}
	track.train = null;
	track.trainTimer = 0;
	
	if (touching) {
		if (track.rotation != track.poweredRotation)
			objects[data.target].rotation = lerp(track.rotation, track.poweredRotation, delta*.01);
	}
	else {
		if (track.rotation != track.defaultRotation)
			objects[data.target].rotation = lerp(track.rotation, track.defaultRotation, delta*.01);
	}
}

function moveButtonStartTrain(name, data, touching, delta) {

	let train = data.target;
	
	if (train in objects) {

			traindata.moving = true;
	}
	data.target = null;
}

function touchingBalls(x, y, w, h) {
	let mybox = {x: x+5, y: y+5, width: w, height: h};
	
	for (var key in objects) {
		if (key.startsWith("helper") || (key == "cursor" && !editor && !editorStubbed)) {
			let data = objects[key];
			if (isNaN(data.x)) continue;
			
			let touching = doBoxesOverlap(
				{x: data.x, y: data.y, width: 20, height: 20},
				mybox);
			
			if (touching)
				return true;
		}
	}
	
	return false;
}

function moveButton(name, data, delta) {
	let player = objects.player;
	let touching = doBoxesOverlap(
		{x: player.x, y: player.y, width: player.size, height: player.size},
		{x: data.x+2, y: data.y+2, width: 6, height: 6});
	
	if (!touching) {
		touching = touchingBalls(data.x+2, data.y+2, 6, 6);
	}
	
	if (data.activated != touching) {
		let pitch = 0;
		if (!touching) {
			pitch = -6;
		}
		playAudio(sndNoise, pitch, 0.2);
		
		if (touching) {
			if (data.sprite % 2 == 0)
				data.sprite++;
			else if (data.sprite % 2 == 1)
				data.sprite--;
		}
	}
	
	data.activated = touching;
	
	if (data.type === null)
		return;
	
	if (data.type == "switchTrack")
		return moveSwitchTrack(name, data, touching, delta);
	
	if (data.type == "startTrain")
		return moveButtonStartTrain(name, data, touching, delta);
	
	console.log("Unhandled button type: ", data.type);
}

function moveFailSafe(name, data, delta) {
	data.frameTime += delta;
	data.frame += Math.floor(data.frameTime / 50);
	data.frameTime %= 50;
	
	if (data.frame > 17)

}

function moveCabbage(name, data, delta) {
	data.frameTime += delta;
	if (!muteHelper && data.frameTime > 30 && data.frame % 5 == 0)
		helperSoundPlayer(0.1);
	
	data.frame += Math.floor(data.frameTime / 30);
	data.frameTime %= 30;
	
	data.frame %= 93;
}

function moveTrains(delta) {
	let buttons = [];
	let trains = [];
	
	for (var key in objects) {
		if (key.startsWith("button"))
			moveButton(key, objects[key], delta);
		
		else if (key.startsWith("train"))

		else if (key.startsWith("helper"))

	}
}

let followObject = 0;
let followObjectName = null;

function moveCamera() {
	let object_length = Object.keys(objects).length;
	while (followObject < 0) {
		followObject += object_length;
		followObjectName = null;
	}
	if (followObject >= object_length) {
		followObject = object_length - 1;
		followObjectName = null;
	}
	
	if (!(followObjectName in objects))
		followObjectName = null;
	
	if (followObjectName == null)
		followObjectName = Object.keys(objects)[followObject];
	
	let target = objects[followObjectName];
	
	followX = Math.floor((canvas.width-target.size)/2) - pWidth;
	followY = Math.floor((canvas.height-target.size)/2) - pHeight;
	if (!keysHeld.KeyV) {
		desiredScrollX = target.x - followX;
		desiredScrollY = target.y - followY;
		
		diffX = scrollX - desiredScrollX;
		diffY = scrollY - desiredScrollY;
		
		scrollX = desiredScrollX;
		scrollY = desiredScrollY;
		
		objects.cursor.x -= diffX;
		objects.cursor.y -= diffY;
	}
}

function moveEditor() {
	newTileX = Math.floor(objects.cursor.x / 10);
	newTileY = Math.floor(objects.cursor.y / 10);
	
	objects.cursor.oob = isNaN(newTileX) || inboundsTile(newTileX, newTileY) == -1;
	
	if (!editor) return;
	if (isNaN(newTileX) || isNaN(newTileY)) return;
	
	if (keysHeld["RightMouse"] && !objects.cursor.oob) {
		placeTrackAt(newTileX, newTileY, 9, true);
	}
	
	else if (keysHeld["LeftMouse"] && !objects.cursor.oob) {
		placeTrackAt(newTileX, newTileY, 0, true);
	}
	
	if (newTileX == objects.cursor.tileX && newTileY == objects.cursor.tileY)
		return;
	
	moveX = objects.cursor.tileX;
	moveY = objects.cursor.tileY;
	
	while (newTileX != moveX || newTileY != moveY) {
		if (Math.abs(newTileX - moveX) > Math.abs(newTileY - moveY))
			moveX += Math.sign(newTileX - moveX);
		else
			moveY += Math.sign(newTileY - moveY);
		
		if (inboundsTile(moveX, moveY) == -1)
			continue;
		
		if (keysHeld["RightMouse"]) {
			placeTrackAt(moveX, moveY, 9, true);
		}
		
		else if (keysHeld["LeftMouse"]) {
			placeTrackAt(moveX, moveY, 0, true);
		}
	}
	
	objects.cursor.tileX = newTileX;
	objects.cursor.tileY = newTileY;
}

function movers(delta, i=0) {
	
	if (delta > 300)
		// lag
		return;
	
	fillDelta = delta;
	while (delta > 15) {
		delta -= 15;
		movers(15, i+1)
	}
	
	if (!keysHeld.KeyP) {
		moveTrains(delta);
	}

	if (i == 0) {// run only once per tick
		movePlayer(fillDelta);
		
		moveCamera();
		
		if (!editorStubbed) moveEditor();
	}
}

function draw(now) {
	if (lastTime == 0) {
		lastTime = now;
	}
	var delta = now - lastTime;
	
	lastTime = now;
	
	if (nextZoom != zoom) {
		zoom = Math.floor(nextZoom * 400) / 400;
		nextZoom = zoom;
		resize();
	}
	
	movers(delta);
	
	ctx.globalAlpha = 1;
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	drawWorld();
	
	drawObjects();
	
	drawController();
	
	if (keysHeld["KeyG"])
		ctx.drawImage(sprites, 0, 0);
	
	if (border || keysHeld["KeyB"]) {
		ctx.globalAlpha = 0.25;
		ctx.fillStyle = "#000";
		ctx.fillRect(0, 0, pWidth, bHeight);
		ctx.fillRect(bWidth+pWidth, 0, pWidth, bHeight);
		ctx.fillRect(0, 0, bWidth, pHeight);
		ctx.fillRect(0, bHeight+pHeight, bWidth, pHeight);
	}
	
	requestAnimationFrame(draw);
}

function play() {
	console.log("would play");
	updateWorld(true);
	
	requestAnimationFrame(draw);
}

});

window.addEventListener("gamepaddisconnected", (e) => {
	console.log(`Gamepad disconnected from index ${e.gamepad.index}`);
	if (gamepadIndex === e.gamepad.index) {
		gamepadIndex = null;
	}
});

function registerGamepadInput(btn, state) {
	if (keysHeld[btn] != state)
		regularInput({code: btn, fake:true, gamepad:true}, state);
}

let lastInputTime = 0;
function updateGamepad(now) {
	if (lastInputTime == 0) {
		lastInputTime = now;
	}
	var inputDelta = now - lastInputTime;
	
	lastInputTime = now;
	
	if (gamepadIndex === null) return;
	
	const gamepads = navigator.getGamepads();
	const gp = gamepads[gamepadIndex];

	if (!gp) return;
	
	const buttons = {// Standard / Playsation
		a: gp.buttons[0]?.pressed,// A / Cross
		b: gp.buttons[1]?.pressed,// B / Circle
		x: gp.buttons[2]?.pressed,// X / Square
		y: gp.buttons[3]?.pressed,// Y / Triangle
		
		lt: gp.buttons[6]?.pressed,// left trigger
		rt: gp.buttons[7]?.pressed,// right trigger
	};
	
	const dpad = {
		up: gp.buttons[12]?.pressed,
		down: gp.buttons[13]?.pressed,
		left: gp.buttons[14]?.pressed,
		right: gp.buttons[15]?.pressed,
	};
	
	// Axes 0: Horizontal (-1 Left, 1 Right)
	// Axes 1: Vertical (-1 Up, 1 Down)
	const deadzone = 0.2; // Ignore minor drift near center
	const stickX = Math.abs(gp.axes[0]) > deadzone ? gp.axes[0] : 0;
	const stickY = Math.abs(gp.axes[1]) > deadzone ? gp.axes[1] : 0;

	// Combined direction readout (D-pad OR Stick)
	registerGamepadInput("ArrowLeft", dpad.left || stickX < -0.5);
	registerGamepadInput("ArrowRight", dpad.right || stickX > 0.5);
	registerGamepadInput("ArrowUp", dpad.up || stickY < -0.5);
	registerGamepadInput("ArrowDown", dpad.down || stickY > 0.5);
	
	registerGamepadInput("KeyZ", buttons.a);
	registerGamepadInput("KeyX", buttons.b);
	registerGamepadInput("KeyC", buttons.x);
	registerGamepadInput("KeyV", buttons.y);
	
	if (buttons.lt) {
		nextZoom = Math.min(maxZoom, Math.max(minZoom, nextZoom - (gp.buttons[6]?.value*inputDelta*0.005)));
	}
	else if (buttons.rt) {
		nextZoom = Math.min(maxZoom, Math.max(minZoom, nextZoom + (gp.buttons[7]?.value*inputDelta*0.005)));
	}
	
	requestAnimationFrame(updateGamepad);
}

let usingGamepad = false;

function regularInput(e, s) {
	if (showController && (e.fake !== true || e.gamepad && s)) {
		// hide onscreen controller if using keyboard or gamepad
		showController = false;
	}
	
	if (e.gamepad && !usingGamepad) { // prevents gamepad cucking keyboard
		if (s) usingGamepad = true;
		else return;
	} else usingGamepad = e.gamepad == true;
	
	code = e.code;
	if (code in alts) code = alts[code];
	
	if (keysHeld[code] == s) // guard against key repeat
		return;
	
	keysHeld[code] = s;
	
	if (code == "Tab" && s) {
		if (e.shiftKey) followObject -= 1;
		else followObject += 1;
		followObjectName = null;
	}
	
	else if (code == "ControlLeft" && s)
		spawnFailSafe(objects.player.x, objects.player.y);
	
	if (["KeyZ", "Enter", "NumpadEnter"].includes(code) && s) {
		//doKeyZ();
		spawnHelper(objects.player.x, objects.player.y);
	}
	objects.player.sprinting = keysHeld["KeyX"] || keysHeld["ShiftLeft"] || keysHeld["ShiftRight"];
	if (["KeyX", "ShiftLeft", "ShiftRight"].includes(code) && s) {
		//doKeyX();
		killHelpers();
	}
	if (["KeyC", "ControlLeft", "ControlRight", "AltRight", ].includes(code) && s) {
		//doKeyC();
		if (!editorStubbed) editor = !editor;
	}
	else if (code == "KeyM" && s)
		muteHelper = !muteHelper;
	
	//if (e.fake !== true)
	//	e.preventDefault();
}

document.onkeydown = function (e) {
		e = e || window.event;
	regularInput(e, true);
};
document.onkeyup = function (e) {
		e = e || window.event;
	regularInput(e, false);
};
</script>
