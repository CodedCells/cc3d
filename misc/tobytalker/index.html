let zoom = 1;

function handleWheelZoom(event) {
	event.preventDefault();
	const zoomAmount = -event.deltaY * 0.001;
	zoom = Math.min(maxZoom, Math.max(minZoom, zoom + zoomAmount));
	resize();
}

function getTouchDistance(touches) {
	const dx = touches[0].clientX - touches[1].clientX;
	const dy = touches[0].clientY - touches[1].clientY;
	return Math.sqrt(dx * dx + dy * dy);
}

function handleTouchStart(event) {
	if (event.touches.length === 2) {
		lastTouchDistance = getTouchDistance(event.touches);
	}
	resize();
}

function handleTouchMove(event) {
	if (event.touches.length === 2) {
		event.preventDefault();
		const currentDistance = getTouchDistance(event.touches);
		if (lastTouchDistance !== null) {
			const distanceDelta = currentDistance - lastTouchDistance;
			zoom = Math.min(maxZoom, Math.max(minZoom, zoom + distanceDelta * 0.005));
		}
		lastTouchDistance = currentDistance;
	}
	resize();
}

function handleTouchEnd(event) {
	if (event.touches.length < 2) {
		lastTouchDistance = null;
	}
}

document.addEventListener('wheel', handleWheelZoom, { passive: false });

function castleGrid(length, y) {
	row = new Array(length).fill(11);
	rowNav = new Array(length).fill(2);
	
	ym = y % 32
	const k = y / (levelHeight - 1);
	for (var x = 0; x < length; x++) {
		xm = x % 32;
		
		//row[x] = ((x*37)*(y*337))%113;
		const j = x / (levelWidth - 1);
		
		const r = Math.floor(j * 255);
		const g = Math.floor(k * 255);
		const b = 128;
		
		row[x] = `rgb(${r}, ${g}, ${b})`;
	}
	level.push(row);
	levelNav.push(rowNav);
}

function boardwalk(length, y) {
	row = new Array(length).fill(11);
	rowNav = new Array(length).fill(255);
	
	ym = y % 32
	for (var x = 0; x < length; x++) {
		xm = x % 32;
		if (y > 141 && y < 150) {// path inner
			if (y % 2 == 1 && (x+(y%4)) % 4 == 3) row[x] = 5;
			else row[x] = 4;
		}
		else if (y > 137 && y < 154) {
			row[x] = 2;
			if ([139, 140, 151, 152].includes(y))
				row[x] = [2, 8][+(x%2 == y%2 && 13 > x%16 && x%16 > 8)];
		}
		else if (y > 131 && y < 160) row[x] = 1;
		else if (ym < 4 || xm < 4) row[x] = 16 + x%2;// planks
		else if (x > 224 && y > 192 && y < 224) {// grass
			row[x] = 1;
			rowNav[x] = 0;
		}
		else if (ym < 6) row[x] = 18 + (ym-4);// struts
		if (row[x] != 11 && row[x] != 18 && row[x] != 19) rowNav[x] = 0;
		
		if (row[x] == 11 && xm == 4) row[x] = 26;
		else if (row[x] == 11 && xm == 31) row[x] = 27;
	}
	level.push(row);
	levelNav.push(rowNav);
}

const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

async function playAudio(dataUri, pitchSemitones = 0, volume = 1.0) {
	await audioCtx.resume(); // resume after user gesture

	// Fetch + decode audio
	const response = await fetch(dataUri);
	const arrayBuffer = await response.arrayBuffer();
	const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

	// Create nodes
	const source = audioCtx.createBufferSource();
	const gainNode = audioCtx.createGain();

	source.buffer = audioBuffer;
	source.playbackRate.value = Math.pow(2, pitchSemitones / 12);
	gainNode.gain.value = volume;

	// Connect nodes: source -> gain -> destination
	source.connect(gainNode).connect(audioCtx.destination);

	// Play immediately
	source.start();

	// Return a Promise that resolves when playback finishes
	return new Promise(resolve => {
		source.onended = resolve;
	});
}

function resize() {
	getDisplay();
	
	var w = window.innerWidth;
	var h = window.innerHeight;

	aspectf = w/h;
	if (aspectf >= 1) {// landscape
		pWidth = Math.round((aspectf * bHeight - bWidth) / 2);
		pHeight = 0;
	} else {// portrait
		pWidth = 0;
		pHeight = Math.round((h/w * bWidth - bHeight) / 2);
	}

	// Change here: scale the canvas resolution by zoom
	canvas.width = pWidth*2 + bWidth;
	canvas.height = pHeight*2 + bHeight;
	
	pWidth = (canvas.width - bWidth) / 2;
	pHeight = (canvas.height - bHeight) / 2;
	
	canvas.width /= zoom;
	canvas.height /= zoom;
}

function posMod(i, m) {
	i %= m;
	if (i < 0) i += m;
	return i;
}

function updateWorld(animateOnly, fx, fy, tx, ty) {
	
	if (fx == undefined) {
		fx = 0;
		fy = 0;
		tx = levelWidth;
		ty = levelHeight
	}
	
	const lastFrame = Math.floor(lastLastTime / 600);
	const frame = Math.floor(lastTime / 600);
	
	var tilesToUpdate = {};
	
	let lastTileFrame = 0;
	let newTileFrame = 0;
	
	for (var i of Object.keys(animatedTiles)) {
		lastTileFrame = lastFrame % animatedTiles[i].length;
		newTileFrame = frame % animatedTiles[i].length;
		if (lastTileFrame != newTileFrame)
			tilesToUpdate[i] = animatedTiles[i][newTileFrame];
	}
	
	for (var y = fy; y < ty; y++) {
		for (var x = fx; x < tx; x++) {
			let i = level[y%levelHeight][x%levelWidth];
			
			if (tilesToUpdate[i])
				i = tilesToUpdate[i];
			
			else if (animateOnly)
				continue;
			
			//if ((x%2 == y%2) == frame)
			//	continue;
			
			drawTile(x%levelWidth, y%levelHeight, i);
		}
	}
}

function drawObjectBig(name, data, spriteX, spriteY) {
	
	let bsData = bigSpriteIndex[data.bigSprite];
	if (bsData === undefined)
		bsData = [0, 0, 8, 8, 1]
	
	let [graphicX, graphicY, graphicW, graphicH, frames] = bsData;
	
	if (data.moving)
		data.sprite = Math.floor(lastTime / 300) % frames;
	else
		data.sprite = 0;
	
	graphicOffX = Math.floor(graphicW/2);
	graphicOffY = Math.floor(graphicH);
	
	if (data.facing == "down" || frames == 0)
		null;
	else if (data.facing == "left")
		graphicX += (graphicW + 1);
	else if (data.facing == "right")
		graphicX += (graphicW + 1) * 2;
	else if (data.facing == "up")
		graphicX += (graphicW + 1) * 3;
	
	if (data.sprite != 2)
		if (data.sprite == 1)
			graphicX += (graphicW + 1) * 4
		else if (data.sprite == 3)
			graphicX += (graphicW + 1) * 8
	
	let spriteSheet = bigSprites;
	if (data.spriteSheet != undefined)
		spriteSheet = data.spriteSheet;
	
	ctx.drawImage(spriteSheet,
		graphicX, graphicY,
		graphicW, graphicH,
		Math.floor(spriteX-graphicOffX), Math.floor(spriteY-graphicOffY),
		graphicW, graphicH,
	);
	
	interractionPointsDebug.push([spriteX, spriteY, "#ffff00"]);
}

function drawObject(name, data) {
	if (data.draw === false) return // skip things we shouldn't draw
	
	var spriteX = Math.floor(data.x - (scrollX - pWidth));
	var spriteY = Math.floor(data.y - (scrollY - pHeight));
	
	var spritAlpha = 1;
	if (data.alpha !== undefined)
		spritAlpha = data.alpha;
	
	spriteY -= data.z;
	
	if (data.drawFunction !== undefined) {
		data.drawFunction(name, data, spriteX, spriteY)
		return;
	}
	
	if (data.spriteW == 0) {
		interractionPointsDebug.push([spriteX, spriteY, "#ff0000"]);
		return;
	}
	
	var graphicX = data.spriteX;
	var graphicY = data.spriteY;
	if (data.flip && name != "player") {// canvases cannot draw flipped images
		graphicX += data.spriteW;
	}
	/* // show offscrren guys at edges
	/* // show offscrren guys at edges
	if (spriteX < 0) spriteX = -2;
	else if (spriteX > canvas.width) spriteX = canvas.width-6;
	
	if (spriteY < 0) spriteY = -2;
	else if (spriteY > canvas.height) spriteY = canvas.height-6;
	*/
	
	spriteX -= Math.floor(data.spriteW / 2);
	spriteY -= Math.floor(data.spriteH / 2);
	
	ctx.drawImage(sprites,
		graphicX, graphicY,
		data.spriteW, data.spriteH,

		spriteY -= data.z;
		
		interractionPointsDebug.push([spriteX, spriteY, "#7f007f"]);
	}
}

	return data.renderPriority;

	var diffY = obj.deltaY;
	var facing = obj.facing;
	
	var canX = true;
	var canY = true;
	
	if (srcX + diffX <= -10 || srcX + diffX >= 222) // Room Horiz Bounds
		canX = false;
	
	if (srcY + diffY <= 108 || srcY + diffY >= 181) // Room Vert Bounds
		canY = false;
	
	// Bookshelf slider
	if (srcX + diffX >= -10 && srcX + diffX <= 95) {
		if (srcY + diffY >= 107 && srcY + diffY <= 155) {
			
			// Moving up into bookshelf: smooth nudge RIGHT AND dampen upward speed
			if (diffY < 0) {
				obj.deltaX = Math.max(obj.deltaX, -diffY * 0.33);
				obj.deltaY = diffY * 0.66; // Halves upward speed so player glides along rather than into the shelf
				if (srcY + diffY < 110) // fix jitter in top corner
					obj.deltaX = 0;
			}
			
			// Moving left into bookshelf: smooth nudge down along slope
			else if (diffX < 0 && diffY >= 0) {
				obj.deltaY = Math.max(obj.deltaY, -diffX * 0.66);
			}
		}
	}
	
	if (canX + canY == 0) // no movey, less mathy
		return [canX, canY];
	
	// bbox time motherfuckers
	boxes = [
		{minX: -60, maxX: 30, minY: 108, maxY: 152}, // near door
		{minX: 188, maxX: 240, minY: 125, maxY: 166}, // desk
		{minX: 165, maxX: 240, minY: 112, maxY: 145}, // chair
		{minX: 188, maxX: 218, minY: 145, maxY: 175}  // bin
	];
	
	for (var i = 0; i < boxes.length; i++) {
		bbox = boxes[i];
		if (srcX + diffX >= bbox.minX && srcX + diffX <= bbox.maxX)
			if (srcY + diffY >= bbox.minY && srcY + diffY <= bbox.maxY) {
				
				if (srcX <= bbox.minX || srcX >= bbox.maxX)
					canX = false;
				if (srcY <= bbox.minY || srcY >= bbox.maxY)
					canY = false;
				
				if (canX + canY == 0)
					return [canX, canY];
			}
	}
	
	return [canX, canY];
}

function moveFollower(delta, name, index, space, playerMoving) {
	if (!(name in objects)) return space;
	
	const me = objects[name];
	
	let personal_space = 24;
	if (me.bigSprite != undefined) {
		if (bigSpriteIndex[me.bigSprite][2] > 32);
			 personal_space = bigSpriteIndex[me.bigSprite][2];
	}
	
	space += Math.floor(personal_space / 2);
	
	if (playerMoving) me.moving = true;
	if (!me.moving) return space + Math.floor(personal_space / 2);
	
	let targetX = objects.player.x;
	let targetY = objects.player.y;
	
	switch (objects.player.facing) {
		case "right": targetX -= space; break;
		case "left": targetX += space; break;
		case "down": targetY -= space; break;
		case "up": targetY += space; break;
	}
	
	// Calculate difference
	const dx = targetX - me.x;
	const dy = targetY - me.y;
	
	if (dx > 0)			me.facing = "right";
	else if (dx < 0)	me.facing = "left";
	if (dy > 1)			me.facing = "down";
	else if (dy < -1)	me.facing = "up";
	
	// Compute distance to target
	const distance = Math.sqrt(dx * dx + dy * dy);
	
	// If close enough, snap to target
	if (distance < (0.5*delta)) {
		me.x = targetX;
		me.y = targetY;
	} else {
		// Calculate movement step (64 * delta) in direction of target
		const moveDist = 0.4 * delta;
		const moveX = (dx / distance) * moveDist;
		const moveY = (dy / distance) * moveDist;

		// Update position
		me.x += moveX;
		me.y += moveY;
	}
	
	if (!playerMoving) me.moving = false;
	
	return space + Math.floor(personal_space / 2);
}

function getNearbyObjects(objects, threshold = 25) {
	const nearby = [];
	const player = objects.player;
	const thresholdSq = threshold * threshold; // Pre-calculate to avoid Math.sqrt()

	for (let key in objects) {
		if (key == "player") continue;
		
		const obj = objects[key];
		const dx = Math.abs(obj.x - player.x);
		const dy = Math.abs(obj.y - player.y + 10);

		if (dx <= threshold && dy <= threshold) {
			if ((dx * dx) + (dy * dy) <= thresholdSq) { // round distance
				nearby.push(key);
			}
		}
	}

	return nearby;
}

// chaser logic

class Node {
	constructor(x, y, g, h, parent = null) {
		this.x = x;
		this.y = y;
		this.g = g; // Cost from start to this node
		this.h = h; // Heuristic cost from this node to goal
		this.f = g + h; // Total cost
		this.parent = parent;
	}
}

function aStarPathfinder(grid, start, end, iterationLimit) {
	const openList = [];
	const closedList = [];
	
	const startNode = new Node(start.x, start.y, 0, heuristic(start, end));
	openList.push(startNode);
	
	let iterations = 0;
	while (openList.length > 0) {
	
		if (iterations >= iterationLimit) {
			//console.log('Iteration limit reached');
			return [];
		}

		// Get the node with the lowest f value
		openList.sort((a, b) => a.f - b.f);
		const currentNode = openList.shift();
		
		if (currentNode.x === end.x && currentNode.y === end.y) {
			return constructPath(currentNode);
		}
		
		closedList.push(currentNode);
		
		// Get neighbors
		const neighbors = getNeighbors(currentNode, grid);
		for (let neighbor of neighbors) {
			if (closedList.some(node => node.x === neighbor.x && node.y === neighbor.y)) {
				continue;
			}
			
			const tentativeG = currentNode.g + getCost(grid, currentNode, neighbor);
			let neighborNode = openList.find(node => node.x === neighbor.x && node.y === neighbor.y);
			
			if (!neighborNode) {
				neighborNode = new Node(neighbor.x, neighbor.y, tentativeG, heuristic(neighbor, end), currentNode);
				openList.push(neighborNode);
			} else if (tentativeG < neighborNode.g) {
				neighborNode.g = tentativeG;
				neighborNode.f = neighborNode.g + neighborNode.h;
				neighborNode.parent = currentNode;
			}
		}
		
		iterations++;
		
	}
	
	return []; // No path found
}

function heuristic(pos0, pos1) {
	// Using Manhattan distance as heuristic
	return Math.abs(pos0.x - pos1.x) + Math.abs(pos0.y - pos1.y);
}

function getNeighbors(node, grid) {
	const neighbors = [];
	const directions = [
		{x: 0, y: -1}, {x: 0, y: 1},  // vertical
		{x: -1, y: 0}, {x: 1, y: 0},  // horizontal
		{x: -1, y: -1}, {x: 1, y: 1}, // diagonal
		{x: -1, y: 1}, {x: 1, y: -1}  // diagonal
	];
	
	for (let dir of directions) {
		const newX = node.x + dir.x;
		const newY = node.y + dir.y;
		
		const lx = posMod(newX, levelWidth);
		const ly = posMod(newY, levelHeight);
		
		if (grid[ly][lx] !== 255) {
			neighbors.push({x: newX, y: newY});
		}
	}
	
	return neighbors;
}

function getCost(grid, currentNode, neighborNode) {
	// Increase the cost for diagonal movement
	const isDiagonal = Math.abs(currentNode.x - neighborNode.x) === 1 && Math.abs(currentNode.y - neighborNode.y) === 1;
	var baseCost = 1;
	
	const lx = posMod(neighborNode.x, levelWidth);
	const ly = posMod(neighborNode.y, levelHeight);
	
	var baseCost = grid[ly][lx] > 1 ? grid[ly][lx] : 1;
	return baseCost + (isDiagonal ? 1 : 0); // Add extra cost for diagonal movement
}

function constructPath(node) {
	const path = [];
	while (node) {
		path.push({x: node.x, y: node.y});
		node = node.parent;
	}
	return path.reverse();
}

function getPointOnCircle(centerX, centerY, radius, angleDegrees) {
	const angleRadians = angleDegrees * (Math.PI / 180); // Convert degrees to radians
	const x = centerX + radius * Math.cos(angleRadians);
	const y = centerY + radius * Math.sin(angleRadians);
	return [x, y];
}

function moveWithOffsetPath(startX, startY, targetX, targetY, maxSteps = 4) {
  const path = [];
  let x = startX;
  let y = startY;

  // Direction vector to target
  const dx = targetX - startX;
  const dy = targetY - startY;
  const dist = Math.hypot(dx, dy);

  if (dist === 0) return [];

  // Normalize direction
  const dirX = dx / dist;
  const dirY = dy / dist;

  // Get a perpendicular vector (rotated 90°)
  const perpX = -dirY;
  const perpY = dirX;

  // Compute offset scale based on distance
  const maxOffset = Math.min(dist / 3, 5); // Tune this
  const offsetAmount = (Math.random() * 2 - 1) * maxOffset;

  // Calculate an offset target
  const offsetTargetX = targetX + perpX * offsetAmount;
  const offsetTargetY = targetY + perpY * offsetAmount;

  for (let step = 0; step < maxSteps; step++) {
	const toOffsetTargetX = offsetTargetX - x;
	const toOffsetTargetY = offsetTargetY - y;
	const stepDist = Math.hypot(toOffsetTargetX, toOffsetTargetY);
	if (stepDist < 0.5) break;

	const stepX = toOffsetTargetX / stepDist;
	const stepY = toOffsetTargetY / stepDist;

	x += stepX;
	y += stepY;
  }
path.push({ x: x/8, y: y/8 });
	
  return path;
}

function moveChaser(name, data, delta) {
	var me = data;
	
	if (me.goals == undefined)
		me.goals = [];
	
	if (keysHeld["KeyH"]) {
		me.x = Math.floor(objects.player.x);
		me.y = Math.floor(objects.player.y);
		me.deltaX = 0;
		me.deltaY = 0;
		me.goals = [];
		me.moving = false;
		return
	}
	
	if (me.goals.length < 1 || me.goals[0].x === undefined) {
		me.goals.shift();
		return
	}
	
	nextX = me.goals[0].x * 8;
	nextY = me.goals[0].y * 8;
	
	var stepX = +me.x;
	var stepY = +me.y;
	
	me.speed = 0.2;
	
	if (nextX < me.x) {
		stepX -= me.speed * delta;
		me.facing = "left";
	}
	else if (nextX > me.x) {
		stepX += me.speed * delta;
		me.facing = "right";
	}
	if (nextY < me.y) {
		stepY -= me.speed * delta;
		me.facing = "up";
	}
	else if (nextY > me.y) {
		stepY += me.speed * delta;
		me.facing = "down";
	}
	
	if (Math.abs(nextX - me.x) < 1 || Math.abs(stepX - nextX) > Math.abs(me.x - nextX))
		me.x = nextX;
	else
		me.x = stepX;
	
	if (Math.abs(nextY - me.y) < 1 || Math.abs(stepY - nextY) > Math.abs(me.y - nextY))
		me.y = nextY;
	else
		me.y = stepY;
	
	me.moving = true;
	if (me.x == nextX && me.y == nextY) {
		me.goals.shift();
		me.steps++;
	}
}

function amIFacing(thing) {
	if (!objects.player.nearObjects.includes(thing))
		return false;
	
	thingObj = objects[thing];
	if (!thingObj)
		return true;
	
	player = objects.player;
	
	if (objects.player.facing == "up")
		return thingObj.y <= player.y - 5 && (player.x - 12 < thingObj.x && player.x + 12 > thingObj.x);
	
	else if (objects.player.facing == "down")
		return thingObj.y >= player.y - 10 && (player.x - 12 < thingObj.x && player.x + 12 > thingObj.x);
	
	else if (objects.player.facing == "left")
		return thingObj.x <= player.x + 1 && (player.y - 15 < thingObj.y && player.y > thingObj.y);
	
	else if (objects.player.facing == "right")
		return thingObj.x >= player.x - 1 && (player.y - 15 < thingObj.y && player.y > thingObj.y);
}

			dialogueQueue[0] = "";
        }
		return;
	}
	
	// scan for interractables
	if (amIFacing("tobytalker")) {
		if (!flags.talkedToToby) {
			dialogueQueue.push("* (It's a dog, he looks\n  fairly annoying.)");
		} else if (flags.ateMoss > 1) {
			dialogueQueue.push("* (The dog can't take\n  a note yet.)");
			dialogueQueue.push("* (But he can take the moss.)\n* (You are no longer [Moss Bonster].)");
			flags.ateMoss--;
		} else {
			dialogueQueue.push("* (The dog is here.)");
		}
		flags.talkedToToby++;
		return;
	}
	
	if (amIFacing("mosseater")) {
		dialogueQueue.push([
			"* (You ate the moss.)\n* (Tastes.. derivative.)",
			"* (You ate more moss.)\n* (Your title was upgraded\n   to [Moss Bonster].)",
			"* (You ate all the moss.)\n* (You moss it already.)"][flags.ateMoss])
		flags.ateMoss++;
		if (flags.ateMoss > 2)
			delete objects["mosseater"];
		return;
	}
	
	if (amIFacing("tlk_shelfdoggo")) {
		dialogueQueue.push("* (There's a small dog figure on\n   the bookshelf.)");
		if (flags.talkedToToby > 0)
			dialogueQueue.push("* (You figure it's annoying too.)");
		
		flags.inspectedFigure++;
		return;
	}
	
	if (amIFacing("spr_bin")) {
		dialogueQueue.push("* (Bin.)");
		flags.inspectedBin++;
		return;
	}
	
	if (amIFacing("tlk_lamp")) {
		dialogueQueue.push("* (Lamp.)");
		flags.inspectedLamp++;
		return;
	}
	
	isThereAShelfHere = objects.player.nearObjects.filter(s => objects[s].interactName == "shelf_any")[0];
	if (isThereAShelfHere && amIFacing(isThereAShelfHere)) {
		dialogueQueue.push(`* (Book ${flags.inspectedBooks+1}.)`);
		flags.inspectedBooks++;
		return;
	}
	
	if (amIFacing("tlk_spoilers")) {
		dialogueQueue.push("* (It's a book containing secrets\n   about upcoming chapters.)");
		dialogueQueue.push("* (The information seemes very,\n   very, intresting.)");
		flags.inspectedSpoilers++;
		return;
	}
}

function drawTextBox(x, y, w, h) {
	ctx.fillStyle = "white";
	ctx.fillRect(x, y, w, h);
	if (w > 6 && h > 6) {
		ctx.fillStyle = "black";
		ctx.fillRect(x+3, y+3, w-6, h-6);
	}
}

function drawText(text, x, y, s, align) {
	dt = [];
	floatingx = 0;
	
	for (var i = 0; i < text.length; i++) {
		c = text.charCodeAt(i);
		cx = c % 16;
		cy = Math.floor(c / 16);
		dt.push([c, cx, cy]);
		floatingx += 8 * s;
	}
	
	if (align == "right") x -= floatingx;
	else if (align == "center") x -= Math.floor(floatingx / 2);
	
	floatingx = 0;
	for (var i = 0; i < dt.length; i++) {
		[c, cx, cy] = dt[i];
		ctx.drawImage(
			font_eng,
			cx * 8, cy * 14,
			8, 14,
			x + floatingx, y,
			8 * s, 14 * s);
		floatingx += 8 * s;
	}
	return floatingx;
}

document.onkeydown = function (e) {
	e = e || window.event;
	regularInput(e, true);
};
document.onkeyup = function (e) {
	e = e || window.event;
	regularInput(e, false);
};
