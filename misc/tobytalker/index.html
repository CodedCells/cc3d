<script>
// engine.js
let zoom = 1;
let minZoom = 1;//0.5;
let maxZoom = 1;//2
let lastTouchDistance = null;

function clamp(v, lo, hi) {
	return v < lo ? lo : (v > hi ? hi : v);
}

function applyZoom(amount) {
	zoom = clamp(zoom + amount, minZoom, maxZoom);
}

function handleWheelZoom(event) {
	event.preventDefault();
	applyZoom(-event.deltaY * 0.001);
	resize();
}

function getTouchDistance(touches) {
	return Math.hypot(
		touches[0].clientX - touches[1].clientX,
		touches[0].clientY - touches[1].clientY);
}

function handleTouchStart(event) {
	if (event.touches.length === 2) {
		lastTouchDistance = getTouchDistance(event.touches);
	}
	resize();
}

function handleTouchMove(event) {
	if (event.touches.length === 2) {
		event.preventDefault();
		const currentDistance = getTouchDistance(event.touches);
		if (lastTouchDistance !== null)
			applyZoom((currentDistance - lastTouchDistance) * 0.005);
		lastTouchDistance = currentDistance;
	}
	resize();
}

function handleTouchEnd(event) {
	if (event.touches.length < 2) {
		lastTouchDistance = null;
	}
}

document.addEventListener('wheel', handleWheelZoom, { passive: false });
document.addEventListener('touchstart', handleTouchStart, { passive: false });
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);


// desired screen boundaries

// basic
function baseObject(x, y, z) {
	return {
		x: x, y: y, z: z,
		deltaX: 0, deltaY: 0,
		size: 20, motion: 0, motionZ: 0,
		moving: false, flip: false
	};
}

// character
function characterObject(x, y, z, facing, sprite) {
	return Object.assign(baseObject(x, y, z), {
		size: 16, motion: 0, motionZ: 0,
		moving: false,
		drawFunction: drawObjectBig,
		bigSprite: sprite,
		facing: facing,
		followers: []
	});
}

// sprite that just sits there
function propObject(x, y, z, spriteX, spriteY, spriteW, spriteH, flip) {
	return Object.assign(baseObject(x, y, z), {
		flip: flip === true,
		spriteX: spriteX, spriteY: spriteY,
		spriteW: spriteW, spriteH: spriteH
	});
}

// invisible: no sprite, interactName is optional
function talkPoint(x, y, interactName) {

		size: 0,
		spriteX: 0, spriteY: 0,

	});
}

const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

async function playAudio(dataUri, pitchSemitones = 0, volume = 1.0) {
	await audioCtx.resume(); // resume after user gesture

	const response = await fetch(dataUri);
	const arrayBuffer = await response.arrayBuffer();
	const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

	const source = audioCtx.createBufferSource();
	const gainNode = audioCtx.createGain();

	source.buffer = audioBuffer;
	source.playbackRate.value = Math.pow(2, pitchSemitones / 12);
	gainNode.gain.value = volume;

	source.connect(gainNode).connect(audioCtx.destination);

	// Play immediately
	source.start();

	// Return a Promise that resolves when playback finishes
	return new Promise(resolve => {
		source.onended = resolve;
	});
}

function box(minX, minY, maxX, maxY) {
	return {minX: minX, minY: minY, maxX: maxX, maxY: maxY};
}

function boxFromRect(x, y, w, h) { // top left corner plus a size
	return box(x, y, x + w, y + h);
}

function boxFromPoints(x1, y1, x2, y2, pad) { // two corners, either way round
	if (pad === undefined) pad = 0;
	
	return box(
		Math.min(x1, x2) - pad, Math.min(y1, y2) - pad,
		Math.max(x1, x2) + pad, Math.max(y1, y2) + pad);
}

function inBox(x, y, b) {
	return b.minX <= x && x <= b.maxX && b.minY <= y && y <= b.maxY;
}

function boxesOverlap(a, b) {
	return a.minX <= b.maxX && b.minX <= a.maxX
		&& a.minY <= b.maxY && b.minY <= a.maxY;
}

function getButtonBox(name) {
	const b = controllerButtons[name];
	let x = b[0];
	
	if (x < 0)
		x += controller.width;
	
	return boxFromRect(x, b[1], b[2], b[3]);
}

var buttonsOn = true;

function newButts(event) {
	
	if (!buttonsOn) return;
	
	if (event == undefined)
		return;
	
	event.preventDefault();
	
	controllerBB = controller.getBoundingClientRect();
	controllerScaleX = controllerBB.width / controller.width;
	controllerScaleY = controllerBB.height / controller.height;

	if (event.touches === undefined)// mousehack
		event.touches = [event];
	
	hitKeys = [];
	for (const touch of event.touches) {
		cursorX = Math.round((touch.clientX - controllerBB.x) / controllerScaleX);
		cursorY = Math.round((touch.clientY - controllerBB.y) / controllerScaleY);
		
		if (!showController) {
			if (!inBox(cursorX, cursorY, getButtonBox("activator")))
				continue;
			
			showController = true;
		}
		
		for (var key of Object.keys(controllerButtons)) {
			if (inBox(cursorX, cursorY, getButtonBox(key))) {
				if (key.includes("_")) {
					key = key.split("_")
					regularInput({code: key[0], fake:true}, true);
					regularInput({code: key[1], fake:true}, true);
					hitKeys += key;
				}
				else {
					regularInput({code: key, fake:true}, true);
					hitKeys.push(key);
				}

}

function getDisplay() {
	controller = document.getElementById("controller");
	
	controller.addEventListener("mousemove", newButts, false);
	controller.addEventListener("mouseleave", newButts, false);
	controller.addEventListener("mousedown", newButts, false);

	ctx.webkitImageSmoothingEnabled = false;

}

function resize() {
	getDisplay();
	
	var w = window.innerWidth;
	var h = window.innerHeight;

	aspectf = w/h;
	if (aspectf >= 1) {// landscape
		pWidth = Math.round((aspectf * bHeight - bWidth) / 2);
		pHeight = 0;
		controller.width = 256;;
		
	} else {// portrait
		pWidth = 0;
		pHeight = Math.round((h/w * bWidth - bHeight) / 2);
		controller.width = 128;
	}

	// Change here: scale the canvas resolution by zoom
	canvas.width = pWidth*2 + bWidth;
	canvas.height = pHeight*2 + bHeight;
	
	pWidth = (canvas.width - bWidth) / 2;
	pHeight = (canvas.height - bHeight) / 2;
	
	canvas.width /= zoom;
	canvas.height /= zoom;
}

function posMod(i, m) {
	i %= m;
	if (i < 0) i += m;
	return i;
}

function drawWorld() {
	ctx.globalCompositeOperation = "source-over";
	ctx.fillStyle = BG_COLOR;
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	
	fx = posMod(Math.floor((scrollX - pWidth) / 8 - 8), levelWidth);
	fy = posMod(Math.floor((scrollY - pHeight) / 8 - 8), levelHeight);
	tx = Math.ceil((bWidth + pWidth + pWidth) / 8) + fx + 16;
	ty = Math.ceil((bHeight + pHeight + pHeight) / 8) + fy + 16;
	
	var offsetX = -Math.floor(scrollX - pWidth);
	var offsetY = -Math.floor(scrollY - pHeight);
	
	ctx.drawImage(sprites, 784, 784, 240, 240, offsetX, offsetY, mapCanvas.width, mapCanvas.height);
}

function screenX(worldX) {
	return Math.floor(worldX - (scrollX - pWidth));
}

function screenY(worldY) {
	return Math.floor(worldY - (scrollY - pHeight));
}

function fillWorldBox(b, colour, alpha) {
	ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
	ctx.fillStyle = colour;
	ctx.fillRect(screenX(b.minX), screenY(b.minY),
		b.maxX - b.minX, b.maxY - b.minY);
	ctx.globalAlpha = 1;
}

function drawObjectBig(name, data, spriteX, spriteY) {
	
	let bsData = bigSpriteIndex[data.bigSprite];
	if (bsData === undefined)
		bsData = [0, 0, 8, 8, 1]
	
	let [graphicX, graphicY, graphicW, graphicH, frames] = bsData;
	
	if (data.moving)
		data.sprite = Math.floor(lastTime / 300) % frames;
	else
		data.sprite = 0;
	
	graphicOffX = Math.floor(graphicW/2);
	graphicOffY = Math.floor(graphicH);
	
	if (data.facing == "down" || frames == 0)
		null;
	else if (data.facing == "left")
		graphicX += (graphicW + 1);
	else if (data.facing == "right")
		graphicX += (graphicW + 1) * 2;
	else if (data.facing == "up")
		graphicX += (graphicW + 1) * 3;
	
	if (data.sprite != 2)
		if (data.sprite == 1)
			graphicX += (graphicW + 1) * 4
		else if (data.sprite == 3)
			graphicX += (graphicW + 1) * 8
	
	let spriteSheet = sprites;
	if (data.spriteSheet != undefined)
		spriteSheet = data.spriteSheet;
	
	ctx.drawImage(spriteSheet,
		graphicX, graphicY,
		graphicW, graphicH,
		Math.floor(spriteX-graphicOffX), Math.floor(spriteY-graphicOffY),
		graphicW, graphicH,
	);
	
	interractionPointsDebug.push([spriteX, spriteY, "#ffff00"]);
}

function drawObjectFailSafe(name, data, spriteX, spriteY) {

function drawObject(name, data) {
	if (data.draw === false) return // nodraw // gaben
	
	var spriteX = screenX(data.x);
	var spriteY = screenY(data.y) - data.z;
	
	var spritAlpha = 1;
	if (data.alpha !== undefined)
		spritAlpha = data.alpha;
	
	if (data.drawFunction !== undefined) {
		data.drawFunction(name, data, spriteX, spriteY)
		return;
	}
	
	if (data.spriteW == 0) {
		interractionPointsDebug.push([spriteX, spriteY, "#ff0000"]);
		return;
	}
	
	var graphicX = data.spriteX;
	var graphicY = data.spriteY;
	if (data.flip && name != "player") {// canvases cannot draw flipped images
		graphicX += data.spriteW;
	}
	
	spriteX -= Math.floor(data.spriteW / 2);
	spriteY -= Math.floor(data.spriteH / 2);
	
	ctx.drawImage(sprites,
		graphicX, graphicY,
		data.spriteW, data.spriteH,
		spriteX, spriteY,
		data.spriteW, data.spriteH
	);

		interractionPointsDebug.push(
			[screenX(data.x), screenY(data.y) - data.z, "#7f007f"]);

function getRenderPriority(data) {

function lerp(a, b, alpha) {
	return a + alpha * (b - a);
}

let lastX = 0;
let lastY = 0;
let lastMove = [0, 0];

// which way the walkable side of a slope lies, relative to the edge
const SLOPE_FACING = {
	"up-left":    {x: -1, y: -1},
	"up-right":   {x:  1, y: -1},
	"down-left":  {x: -1, y:  1},
	"down-right": {x:  1, y:  1}
};

const ROOM_BOUNDS = box(-10, 108, 222, 181);

const worldColliders = {
	"bboxes": [
		{minX: 165, maxX: 240, minY: 112, maxY: 145}, // chair
		{minX: -60, maxX: 19, minY: 108, maxY: 152}, // near door
		{minX: 188, maxX: 240, minY: 125, maxY: 166}, // desk
		{minX: 188, maxX: 218, minY: 145, maxY: 175}  // bin
	],
	"slopes": [
		{x1: 95, y1: 104, x2: 19, y2: 152, facing: "down-right"} // shelf edge
	]
};

function canMove(obj) {
	const srcX = obj.x;
	const srcY = obj.y;
	let diffX = obj.deltaX;
	let diffY = obj.deltaY;
	
	// The room itself is just another box, only we're kept inside it rather than out of it.
	// such is life
	let canX = srcX + diffX > ROOM_BOUNDS.minX && srcX + diffX < ROOM_BOUNDS.maxX;
	let canY = srcY + diffY > ROOM_BOUNDS.minY && srcY + diffY < ROOM_BOUNDS.maxY;
	
	if (!canX && !canY) // no movey, less mathy
		return [canX, canY];
	
	// Slip and slide
	for (const slopeEdge of worldColliders.slopes) {
		const sx = slopeEdge.x1;
		const sy = slopeEdge.y1;
		const ex = slopeEdge.x2;
		const ey = slopeEdge.y2;

		const skin = 1; // stand this far off the shelf
		const pad = skin + 1; // slack on the box so we don't clip right at the edge

		const destX = srcX + diffX;
		const destY = srcY + diffY;
		
		if (!boxesOverlap(// no touch no do
				boxFromPoints(srcX, srcY, destX, destY),
				boxFromPoints(sx, sy, ex, ey, pad)))
			continue;

		let lx = ex - sx;
		let ly = ey - sy;
		const len = Math.hypot(lx, ly);

		if (len === 0) continue; // degenerate edge, nothing to slide along, nasty

		lx /= len;
		ly /= len; // unit vector running along the edge

		let nx = ly;
		let ny = -lx; // unit normal, one of the two sides

		// Flip it if it isn't pointing the way the slope is meant to face, so the
		// order the endpoints are written in no longer matters.
		const face = SLOPE_FACING[slopeEdge.facing] || SLOPE_FACING["down-right"];

		if (nx * face.x + ny * face.y < 0) {
			nx = -nx;
			ny = -ny;
		}

		// 0 at one end of the edge, 1 at the other. Past either end the room
		// bound and the door box are already doing the job.
		const along = ((destX - sx) * lx + (destY - sy) * ly) / len;
		const alongNow = ((srcX - sx) * lx + (srcY - sy) * ly) / len;

		if ((along > 0 && along < 1) || (alongNow > 0 && alongNow < 1)) {
			const gapNow = (srcX - sx) * nx + (srcY - sy) * ny; // where we are
			const gapDest = (destX - sx) * nx + (destY - sy) * ny; // where we'd land

			if (gapDest < skin) {
				if (gapNow > skin) {
					obj.deltaX += nx * (skin - gapDest);
					obj.deltaY += ny * (skin - gapDest);
				}
				else {
					const into = obj.deltaX * nx + obj.deltaY * ny;

					if (into < 0) {
						obj.deltaX -= nx * into;
						obj.deltaY -= ny * into;
					}

					if (gapNow < 0) { // pull out
						const out = Math.min(skin - gapNow, 1);
						obj.deltaX += nx * out;
						obj.deltaY += ny * out;
					}
				}

				diffX = obj.deltaX;
				diffY = obj.deltaY;
			}
		}
	}
	
	// bbox time motherfuckers
	for (const solid of worldColliders.bboxes) {
		if (!inBox(srcX + diffX, srcY + diffY, solid))
			continue;
		
		if (srcX <= solid.minX || srcX >= solid.maxX)
			canX = false;
		if (srcY <= solid.minY || srcY >= solid.maxY)
			canY = false;
		
		if (!canX && !canY)
			return [canX, canY];
	}
	
	return [canX, canY];
}

function moveFollower(delta, name, index, space, playerMoving, leader) {
	if (leader === undefined) leader = objects.player;
	if (!(name in objects)) return space;
	
	const me = objects[name];
	
	let personal_space = 24;
	if (me.bigSprite != undefined) {
		if (bigSpriteIndex[me.bigSprite][2] > 32);
			 personal_space = bigSpriteIndex[me.bigSprite][2];
	}
	
	space += Math.floor(personal_space / 2);
	
	if (playerMoving) me.moving = true;
	if (!me.moving) return space + Math.floor(personal_space / 2);
	
	let targetX = leader.x;
	let targetY = leader.y;
	
	switch (leader.facing) {
		case "right": targetX -= space; break;
		case "left": targetX += space; break;
		case "down": targetY -= space; break;
		case "up": targetY += space; break;
	}
	
	// Calculate difference
	const dx = targetX - me.x;
	const dy = targetY - me.y;
	
	if (dx > 0)			me.facing = "right";
	else if (dx < 0)	me.facing = "left";
	if (dy > 1)			me.facing = "down";
	else if (dy < -1)	me.facing = "up";
	
	// Compute distance to target
	const distance = Math.sqrt(dx * dx + dy * dy);
	
	// If close enough, snap to target
	if (distance < (0.5*delta)) {
		me.x = targetX;
		me.y = targetY;
	} else {
		// Calculate movement step (64 * delta) in direction of target
		const moveDist = 0.4 * delta;
		const moveX = (dx / distance) * moveDist;
		const moveY = (dy / distance) * moveDist;

		// Update position
		me.x += moveX;
		me.y += moveY;
	}
	
	if (!playerMoving) me.moving = false;
	
	return space + Math.floor(personal_space / 2);
}

function moveFailSafe(name, data, delta) {
	data.frameTime += delta;
	data.frame += Math.floor(data.frameTime / 50);
	data.frameTime %= 50;

	if (data.frame > 17)
		delete objects[name];
}

function getNearbyObjects(objects, sourceName = "player", threshold = 25) {
	const nearby = [];
	const source = objects[sourceName];
	if (source === undefined) return nearby;
	const thresholdSq = threshold * threshold; // Pre-calculate to avoid Math.sqrt()

	for (let key in objects) {
		if (key == sourceName) continue;
		
		const obj = objects[key];
		const dx = Math.abs(obj.x - source.x);
		const dy = Math.abs(obj.y - source.y + 10);

		if (dx <= threshold && dy <= threshold) {
			if ((dx * dx) + (dy * dy) <= thresholdSq) { // round distance
				nearby.push(key);
			}
		}
	}

	return nearby;
}

// Humans, Monsters, DOGS. who cares? not this code.
function moveCharacter(pl, delta) {
	const me = objects[pl.name];
	if (me === undefined) return;
	
	if (me.bigSpriteNextDelay > 0) {
		me.bigSpriteNextDelay -= delta;
		if (me.bigSpriteNextDelay <= 0) {
			me.bigSprite = me.bigSpriteNext;
			me.bigSpriteNext = null;
			me.bigSpriteNext = -1;
		}
	}
	
	const input = pl.input;
	var speedMul = me.motion / 256;
	
	var move = [0, 0];
	var wasMoving = me.moving;
	
	if (dialogueQueue.length && pl.name == "player") // no movey if talking
		a=1;
	else if (input.ArrowLeft) {
		move[0] = -1;
		me.facing = "left";
		me.flip = false;
	}
	else if (input.ArrowRight) {
		move[0] = 1;
		me.facing = "right";
		me.flip = true;
	}
	
	if (dialogueQueue.length && pl.name == "player") // no movey if talking
		a=1;
	else if (input.ArrowUp) {
		move[1] = -1;
		me.facing = "up";
		if (!wasMoving)
			me.flip = false;
	}
	else if (input.ArrowDown) {
		move[1] = 1;
		me.facing = "down";
		if (!wasMoving)
			me.flip = true;
	}
	me.moving = false;
	me.moving = move[0] !== 0 || move[1] !== 0;
	
	var multiMove = 1;
	if (move[0] != 0 && move[1] != 0)
		multiMove = 0.66;
	if (move[0] != 0 || move[1] != 0)
		pl.lastMove = move;
	
	me.deltaX = pl.lastMove[0] * delta * speedMul * multiMove
	me.deltaY = pl.lastMove[1] * delta * speedMul * multiMove;
	
	if (me.sprinting) {
		me.deltaX *= 2;
		me.deltaY *= 2;
	}
	[canX, canY] = canMove(me)
	
	if (me.sprinting && (canX + canY == 0)) {
		me.deltaX /= 2;
		me.deltaY /= 2;
	}
	
	[canX, canY] = canMove(me)
	
	if (!canX)
		me.deltaX = 0;
	if (!canY)
		me.deltaY = 0;
	
	me.x += me.deltaX;
	me.y += me.deltaY;
	
	if (pl.leadsParty && me.followers !== undefined) {
		let distance = 12;
		me.followers.forEach((name, index) => {
			distance = moveFollower(delta, name, index, distance, me.moving, me);
		});
	}
	
	closeObjects = getNearbyObjects(objects, pl.name);
	me.nearObjects = closeObjects;
	
	if (pl.leadsParty && me.followers !== undefined) {
		closeObjects.forEach((name, index) => {
			if (isPlayerControlled(name)) return; // don't recruit someone's player
			if (!me.followers.includes(name) && objects[name].canFollow) {
				me.followers.push(name);
				if (objects[name].goals) objects[name].goals = [];
			}
		});
	}
	
	
	if (pl.leadsParty) { // chasers home in on the lead player only
		playerNavPos = [me.x, me.y];
	}
	
	if (me.z > 0) {
		me.z += me.motionZ;
		me.motionZ -= 0.5;
		if (me.motionZ < -4)
			me.motionZ = -2;
	} else {
		me.z = 0;
		me.motionZ = 0;
	}
	
	if (me.moving) {
		me.motion = 30;
	} else {
		me.motion = 0;
	}
}

// chaser logic

class Node {
	constructor(x, y, g, h, parent = null) {
		this.x = x;
		this.y = y;
		this.g = g; // Cost from start to this node
		this.h = h; // Heuristic cost from this node to goal
		this.f = g + h; // Total cost
		this.parent = parent;
	}
}

function aStarPathfinder(grid, start, end, iterationLimit) {
	const openList = [];
	const closedList = [];
	
	const startNode = new Node(start.x, start.y, 0, heuristic(start, end));
	openList.push(startNode);
	
	let iterations = 0;
	while (openList.length > 0) {
	
		if (iterations >= iterationLimit) {
			//console.log('Iteration limit reached');
			return [];
		}

		// Get the node with the lowest f value
		openList.sort((a, b) => a.f - b.f);
		const currentNode = openList.shift();
		
		if (currentNode.x === end.x && currentNode.y === end.y) {
			return constructPath(currentNode);
		}
		
		closedList.push(currentNode);
		
		// Get neighbors
		const neighbors = getNeighbors(currentNode, grid);
		for (let neighbor of neighbors) {
			if (closedList.some(node => node.x === neighbor.x && node.y === neighbor.y)) {
				continue;
			}
			
			const tentativeG = currentNode.g + getCost(grid, currentNode, neighbor);
			let neighborNode = openList.find(node => node.x === neighbor.x && node.y === neighbor.y);
			
			if (!neighborNode) {
				neighborNode = new Node(neighbor.x, neighbor.y, tentativeG, heuristic(neighbor, end), currentNode);
				openList.push(neighborNode);
			} else if (tentativeG < neighborNode.g) {
				neighborNode.g = tentativeG;
				neighborNode.f = neighborNode.g + neighborNode.h;
				neighborNode.parent = currentNode;
			}
		}
		
		iterations++;
		
	}
	
	return []; // No path found
}

function heuristic(pos0, pos1) {
	// Using Manhattan distance as heuristic
	return Math.abs(pos0.x - pos1.x) + Math.abs(pos0.y - pos1.y);
}

function getNeighbors(node, grid) {
	const neighbors = [];
	const directions = [
		{x: 0, y: -1}, {x: 0, y: 1},  // vertical
		{x: -1, y: 0}, {x: 1, y: 0},  // horizontal
		{x: -1, y: -1}, {x: 1, y: 1}, // diagonal
		{x: -1, y: 1}, {x: 1, y: -1}  // diagonal
	];
	
	for (let dir of directions) {
		const newX = node.x + dir.x;
		const newY = node.y + dir.y;
		
		const lx = posMod(newX, levelWidth);
		const ly = posMod(newY, levelHeight);
		
		if (grid[ly][lx] !== 255) {
			neighbors.push({x: newX, y: newY});
		}
	}
	
	return neighbors;
}

function getCost(grid, currentNode, neighborNode) {
	// Increase the cost for diagonal movement
	const isDiagonal = Math.abs(currentNode.x - neighborNode.x) === 1 && Math.abs(currentNode.y - neighborNode.y) === 1;
	var baseCost = 1;
	
	const lx = posMod(neighborNode.x, levelWidth);
	const ly = posMod(neighborNode.y, levelHeight);
	
	var baseCost = grid[ly][lx] > 1 ? grid[ly][lx] : 1;
	return baseCost + (isDiagonal ? 1 : 0); // Add extra cost for diagonal movement
}

function constructPath(node) {
	const path = [];
	while (node) {
		path.push({x: node.x, y: node.y});
		node = node.parent;
	}
	return path.reverse();
}

function getPointOnCircle(centerX, centerY, radius, angleDegrees) {
	const angleRadians = angleDegrees * (Math.PI / 180); // Convert degrees to radians
	const x = centerX + radius * Math.cos(angleRadians);
	const y = centerY + radius * Math.sin(angleRadians);
	return [x, y];
}

function moveWithOffsetPath(startX, startY, targetX, targetY, maxSteps = 4, offsetBias = null) {
  const path = [];
  let x = startX;
  let y = startY;

  // Direction vector to target
  const dx = targetX - startX;
  const dy = targetY - startY;
  const dist = Math.hypot(dx, dy);

  if (dist === 0) return [];

  // Normalize direction
  const dirX = dx / dist;
  const dirY = dy / dist;

  // Get a perpendicular vector (rotated 90°)
  const perpX = -dirY;
  const perpY = dirX;

  // Compute offset scale based on distance
  const maxOffset = Math.min(dist / 3, 5); // Tune this
  // offsetBias is the caller's own -1..1 weave. Re-rolling this every path was
  // what threw the chasers sideways (and flipped their facing) mid-walk.
  const bias = (offsetBias === null) ? (Math.random() * 2 - 1) : offsetBias;
  const offsetAmount = bias * maxOffset;

  // Calculate an offset target
  const offsetTargetX = targetX + perpX * offsetAmount;
  const offsetTargetY = targetY + perpY * offsetAmount;

  for (let step = 0; step < maxSteps; step++) {
	const toOffsetTargetX = offsetTargetX - x;
	const toOffsetTargetY = offsetTargetY - y;
	const stepDist = Math.hypot(toOffsetTargetX, toOffsetTargetY);
	if (stepDist < 0.5) break;

	const stepX = toOffsetTargetX / stepDist;
	const stepY = toOffsetTargetY / stepDist;

	x += stepX;
	y += stepY;
  }
path.push({ x: x/8, y: y/8 });
	
  return path;
}


function updateChaser(name, data) {
	var me = data;
	
	if (me.goals.length == 0) {
		const start = {
			x: Math.floor(me.x / 8),
			y: Math.floor(me.y / 8)};
		
		const target = {
			x: Math.round((playerNavPos[0]) / 8),
			y: Math.round((playerNavPos[1]) / 8)};
		
		if (start.x == target.x && start.y == target.y) {
			me.moving = false;
			return false
		}
		
		if (!canPathfind) {
			me.moving = false;
			return false
		}
		
		if (me.offsetBias === undefined)
			me.offsetBias = Math.random() * 2 - 1;
		else // drift it slowly, so they still weave about, just not every frame
			me.offsetBias = clamp(me.offsetBias + (Math.random() - 0.5) * 0.05, -1, 1);
		
		me.goals = moveWithOffsetPath(
			me.x, me.y, playerNavPos[0], playerNavPos[1], 4, me.offsetBias);
		
		if (me.goals.length > 20) me.goals.length = 20;
		return true
	}
}

function forEachChaser(fn) {
	for (const key in objects) {
		if (!key.startsWith("chaser"))

		fn(key, objects[key]);
	}
}

function updateChasers() {

	forEachChaser(function (key, data) {

		numChasers++;
	});
}

function dropDeadGoals(me) {
	while (me.goals.length && me.goals[0].x === undefined)
		me.goals.shift(); // bin duds
}

function moveChaser(name, data, delta) {
	var me = data;
	
	if (me.goals == undefined)
		me.goals = [];
	
	if (keysHeld["KeyH"]) {
		me.x = Math.floor(objects.player.x);
		me.y = Math.floor(objects.player.y);
		me.deltaX = 0;
		me.deltaY = 0;
		me.goals = [];
		me.moving = false;
		return
	}
	
	
	const startX = me.x;
	const startY = me.y;
	
	me.speed = 0.08;
	
	let budget = me.speed * delta;
	if (!(budget > 0)) budget = 0;
	if (budget > 32) budget = 32; // don't fling them across the room after a lag spike
	
	let legs = 0;
	while (budget > 0.0001 && legs++ < 8) {
		dropDeadGoals(me);
		
		if (me.goals.length < 1) {
			updateChaser(name, me); // top up now rather than idling until doTick
			dropDeadGoals(me);
			
			if (me.goals.length < 1)
				break; // nowhere to be, stand still
		}
		
		const nextX = me.goals[0].x * 8;
		const nextY = me.goals[0].y * 8;
	 
		const dx = nextX - me.x;
		const dy = nextY - me.y;
		const dist = Math.hypot(dx, dy);
			   
		if (dist <= budget) { // arrived, spend what's left on the next leg
			me.x = nextX;
			me.y = nextY;
			budget -= dist;
			me.goals.shift();
			me.steps++;
			continue;
		}
		
		me.x += (dx / dist) * budget;
		me.y += (dy / dist) * budget;
		budget = 0;
	}
	
	const movedX = me.x - startX;
	const movedY = me.y - startY;
	
	me.moving = Math.abs(movedX) > 0.01 || Math.abs(movedY) > 0.01;
	
	const smooth = Math.min(1, delta / 100);
	if (me.faceX === undefined) { me.faceX = 0; me.faceY = 0; }
	me.faceX += (movedX - me.faceX) * smooth;
	me.faceY += (movedY - me.faceY) * smooth;
	
	if (me.moving && Math.hypot(me.faceX, me.faceY) > 0.05) {
		if (Math.abs(me.faceX) > Math.abs(me.faceY))
			me.facing = me.faceX < 0 ? "left" : "right";
		else
			me.facing = me.faceY < 0 ? "up" : "down";
	}
}

}

function doTickDialogue() {
	while (dialogueQueue[0].length > 0) {
		newChar = dialogueQueue[0][0];
		currentDialogue += newChar;
		dialogueQueue[0] = dialogueQueue[0].slice(1);
		if (!["*", "\n"].includes(newChar) && !(last == newChar && ["*", "\n", " "].includes(newChar))) {
			playAudio(sndTypewriterDefault, (Math.random()-.5)*.2, 0.2);
			
			if (newChar == ",")
				dialgoueTimeout = 5;
			
			break;
		}
		last = newChar;
		if (newChar == "\n" && dialogueQueue[0][0] != " ") {

			break
		}
	}

function doTick() {
	tick++
	updateChasers();
	
	last = null;
	if (dialogueQueue.length && tick % 1 == 0) {
		if (dialgoueTimeout)
			dialgoueTimeout--;
		else
			doTickDialogue()
	}
	
	if (squeakCounter != 0)
		if (squeakCounter <= -squakDecay)
			squeakCounter += squakDecay;
		else if (squeakCounter >= squakDecay)
			squeakCounter -= squakDecay;
		else
			squeakCounter = 0;
}

// to the map on the fly by regularInput.
const INPUT_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
	"KeyZ", "KeyX", "KeyC"];

function makeInputState() {
	const state = {};
	
	for (const key of INPUT_KEYS)
		state[key] = false;
	
	return state;
}

var keysHeld = makeInputState();

var alts = {
}

/*
One entry per person playing. players[0] is the keyboard / touchscreen /
first-gamepad player; every extra gamepad that turns up gets handed the next
name out of spareCharacters. Each player owns its own held-key map so two
people can hold left at the same time without fighting over one object.
*/

let players = [
	{name: "player", input: keysHeld, lastMove: [0, 0], leadsParty: true}
];

// who extra controllers get to drive, in order
let spareCharacters = ["tobytalker"];

function isPlayerControlled(name) {
	return players.some(pl => pl.name == name);
}

function getPlayerOf(name) {
	return players.find(pl => pl.name == name);
}

function applySprint(pl) {
	const obj = objects[pl.name];
	if (obj === undefined) return;
	obj.sprinting = pl.input["KeyX"] || pl.input["ShiftLeft"] || pl.input["ShiftRight"];
}

// Promote an existing object to a player-controlled character.
function addPlayer(name) {
	const obj = objects[name];
	if (obj === undefined || isPlayerControlled(name)) return null;
	
	// make sure it has everything moveCharacter expects
	if (obj.x === undefined) obj.x = 0;
	if (obj.y === undefined) obj.y = 0;
	if (obj.z === undefined) obj.z = 0;
	if (obj.deltaX === undefined) obj.deltaX = 0;
	if (obj.deltaY === undefined) obj.deltaY = 0;
	if (obj.motion === undefined) obj.motion = 0;
	if (obj.motionZ === undefined) obj.motionZ = 0;
	if (obj.facing === undefined) obj.facing = "down";
	obj.moving = false;
	obj.sprinting = false;
	obj.goals = []; // drop any pathfinding, now you're behind the wheel
	
	// a driven character shouldn't also be trailing behind player 1
	players.forEach(pl => {
		const lead = objects[pl.name];
		if (lead && lead.followers)
			lead.followers = lead.followers.filter(f => f != name);
	});
	
	const pl = {name: name, input: makeInputState(), lastMove: [0, 0], leadsParty: false,
		facePressed: [false, false, false, false]} // A B X Y, last frame
	players.push(pl);
	return pl;
}

// Hand control back / park a character where it stands.
function removePlayer(slot) {
	if (slot < 1 || slot >= players.length) return; // never drop player 1
	
	const pl = players.splice(slot, 1)[0];
	const obj = objects[pl.name];
	if (obj) {
		obj.moving = false;
		obj.sprinting = false;
		obj.deltaX = 0;
		obj.deltaY = 0;
		obj.motion = 0;
	}
	if (pl.name.startsWith("temp_player"))
		delete objects[pl.name];
}

// gamepad shizzle, let the console peasents feast
// One pad per player: pad slot 0 drives players[0], slot 1 drives players[1],
// and so on. Plug a second pad in and toby wakes up.
let gamepadIndices = []; // navigator.getGamepads() indices, in plug-in order
let gamepadPolling = false;

window.addEventListener("gamepadconnected", (e) => {
	console.log(`Gamepad connected at index ${e.gamepad.index}: ${e.gamepad.id}`);
	
	if (!gamepadIndices.includes(e.gamepad.index))
		gamepadIndices.push(e.gamepad.index);
	
	assignGamepads();
	
	// Start polling when the first gamepad connects
	if (!gamepadPolling) {
		gamepadPolling = true;
		requestAnimationFrame(updateGamepads);
	}
});

window.addEventListener("gamepaddisconnected", (e) => {
	console.log(`Gamepad disconnected from index ${e.gamepad.index}`);
	
	const slot = gamepadIndices.indexOf(e.gamepad.index);
	if (slot == -1) return;
	
	releasePlayerInput(slot); // don't leave a direction stuck on
	gamepadIndices.splice(slot, 1);
	
	// park any player that no longer has a pad (player 1 always survives, still got the keyboard or the touch controller)
	while (players.length > Math.max(1, gamepadIndices.length)) {
		releasePlayerInput(players.length - 1);
		removePlayer(players.length - 1);
	}
});

// give every extra pad a character to drive
function assignGamepads() {
	while (players.length < gamepadIndices.length) {
		let next = spareCharacters.find(
			name => objects[name] !== undefined && !isPlayerControlled(name));
		
		if (next === undefined) {// nobody left to hand out
			next = `temp_player${players.length}`;
			if (players.length > 4)
				playerSprite = "carby";
			else
				playerSprite = ["susie_light", "ralsei"][players.length-2];
			
			objects[next] = characterObject(objects.player.x, objects.player.y-1, 0, "down", playerSprite);
		}
		if (addPlayer(next) === null) break;
		
		console.log(`Pad ${players.length - 1} is now driving "${next}"`);
	}
}

function releasePlayerInput(slot) {
	const pl = players[slot];
	if (pl === undefined) return;
	
	for (const key of Object.keys(pl.input))
		registerGamepadInput(slot, key, false);
}

function registerGamepadInput(slot, btn, state) {
	const pl = players[slot];
	if (pl === undefined) return;
	if (pl.input[btn] == state) return;
	
	if (slot == 0) { // player 1 shares the keyboard path
		regularInput({code: btn, fake:true, gamepad:true}, state);
		return;
	}
	
	pl.input[btn] = state;
	applySprint(pl);
	
	if (state) showController = false; // hide the touch pad, we've got hardware
}

function readGamepad(slot) {
	const gp = navigator.getGamepads()[gamepadIndices[slot]];
	
	if (!gp) return;
	
	const buttons = {// Standard / Playsation
		a: gp.buttons[0]?.pressed,// A / Cross
		b: gp.buttons[1]?.pressed,// B / Circle
		x: gp.buttons[2]?.pressed,// X / Square
		y: gp.buttons[3]?.pressed,// Y / Triangle
	};
	
	const dpad = {
		up: gp.buttons[12]?.pressed,
		down: gp.buttons[13]?.pressed,
		left: gp.buttons[14]?.pressed,
		right: gp.buttons[15]?.pressed,
	};
	
	// Axes 0: Horizontal (-1 Left, 1 Right)
	// Axes 1: Vertical (-1 Up, 1 Down)
	const deadzone = 0.2; // Ignore minor drift near center
	const stickX = Math.abs(gp.axes[0]) > deadzone ? gp.axes[0] : 0;
	const stickY = Math.abs(gp.axes[1]) > deadzone ? gp.axes[1] : 0;
	
	// Combined direction readout (D-pad OR Stick)
	registerGamepadInput(slot, "ArrowLeft", dpad.left || stickX < -0.5);
	registerGamepadInput(slot, "ArrowRight", dpad.right || stickX > 0.5);
	registerGamepadInput(slot, "ArrowUp", dpad.up || stickY < -0.5);
	registerGamepadInput(slot, "ArrowDown", dpad.down || stickY > 0.5);
	
	const pl = players[slot];
	if (pl.name == "tobytalker") {
		const face = [!!buttons.a, !!buttons.b, !!buttons.x, !!buttons.y];
		worldColliders.bboxes[0] = {minX: 0, maxX: 0, minY: 0, maxY: 0}
		
		if (face.some((down, i) => down && !pl.facePressed[i])) {
			playAudio(sndPomBark, squeakCounter++, 0.2);
			me = objects[pl.name];
			me.bigSprite = "toby_talk";
			me.bigSpriteNext = "toby";
			me.bigSpriteNextDelay = 100; // ms
			
			if (squeakCounter > 11) {
				spawnFailSafe(me.x, me.y-20 - me.z);
				squeakCounter = -8;
			}
			
			if (face[0]) {
				me.motionZ = 3;
				if (me.z < 60) {
					me.z += me.motionZ;
				}
				me.bigSpriteNextDelay = 150; // ms
			}
		}
		
		pl.facePressed = face;
	}
	
	registerGamepadInput(slot, "KeyZ", buttons.a);
	registerGamepadInput(slot, "KeyX", buttons.b);
	registerGamepadInput(slot, "KeyC", buttons.x);
}

function updateGamepads() {
	for (let slot = 0; slot < gamepadIndices.length; slot++)
		readGamepad(slot);
	
	requestAnimationFrame(updateGamepads);
}

let usingGamepad = false;

function regularInput(e, s) {
	if (showController && (e.fake !== true || e.gamepad && s)) {
		// hide onscreen controller if using keyboard or gamepad
		showController = false;
	}
	
	if (e.gamepad && !usingGamepad) { // prevents gamepad cucking keyboard
		if (s) usingGamepad = true;
		else return;
	} else usingGamepad = e.gamepad == true;
	
	code = e.code;
	if (code in alts) code = alts[code];
	
    if (keysHeld[code] == s) // guard against key repeat
        return;
	
	keysHeld[code] = s;
	
	if (["KeyZ", "Enter", "NumpadEnter"].includes(code) && s) {
		doKeyZ();
	}
	applySprint(players[0]);
	if (["KeyX", "ShiftLeft", "ShiftRight"].includes(code) && s) {
		doKeyX();
	}
	if (["KeyC", "ControlLeft", "ControlRight", "AltRight", ].includes(code) && s) {
		//doKeyC();
	}
	
	if (code == "KeyQ" && s) {
		spawnChaserAt(Math.floor(scrollX/tileSize), Math.floor(scrollY/tileSize), "carby");
	}
	
	if (code == "ControlLeft" && s)
		spawnFailSafe(objects.player.x, objects.player.y-20);
}

// talkey stuff

let dialogueQueue = [];
let currentDialogue = "";
let dialgoueTimeout = 0;

/*
How far a character can reach, and in which direction. getNearbyObjects has
already thrown out anything more than 25px away, so the far edges here only
have to be no tighter than that.
*/
function getFacingBox(obj) {
	switch (obj.facing) {
		case "up":    return box(obj.x - 12, obj.y - 35, obj.x + 12, obj.y -  5);
		case "down":  return box(obj.x - 12, obj.y - 10, obj.x + 12, obj.y + 15);
		case "left":  return box(obj.x - 25, obj.y - 15, obj.x +  1, obj.y     );
		case "right": return box(obj.x -  1, obj.y - 15, obj.x + 25, obj.y     );
	}
	
	return box(obj.x, obj.y, obj.x, obj.y);
}

function amIFacing(thing) {
	if (!objects.player.nearObjects.includes(thing))
		return false;
	
	const thingObj = objects[thing];
	if (!thingObj)
		return true;
	
	return inBox(thingObj.x, thingObj.y, getFacingBox(objects.player));
}

const interactions = [
	{name: "tobytalker", talk: function () {
		let lines;
		
		if (!flags.talkedToToby)
			lines = ["* (It's a dog, he looks\n  fairly annoying.)"];
		
		else if (flags.ateMoss > 1) {
			lines = [
				"* (The dog can't take\n  a note yet.)",
				"* (But he can take the moss.)\n* (You are no longer [Moss Bonster].)"];
			flags.ateMoss = 1;
		}
		
		else
			lines = ["* (The dog is here.)"];
		
		flags.talkedToToby++;
		return lines;
	}},
	
	{name: "mosseater", talk: function () {
		const lines = [[
			"* (You ate the moss.)\n* (Tastes.. derivative.)",
			"* (You ate more moss.)\n* (Your title was upgraded\n   to [Moss Bonster].)",
			"* (You ate all the moss.)\n* (You moss it already.)"][flags.ateMoss]];
		
		flags.ateMoss++;
		if (flags.ateMoss > 2)
			delete objects["mosseater"];
		
		return lines;
	}},
	
	{name: "tlk_shelfdoggo", flag: "inspectedFigure", talk: function () {
		const lines = ["* (There's a small dog figure on\n   the bookshelf.)"];
		
		if (flags.talkedToToby > 0)
			lines.push("* (You figure it's annoying too.)");
		
		return lines;
	}},
	
	{name: "spr_bin", flag: "inspectedBin", lines: ["* (Bin.)"]},
	
	{name: "tlk_lamp", flag: "inspectedLamp", lines: ["* (Lamp.)"]},
	
	{interactName: "shelf_any", flag: "inspectedBooks",
		talk: () => [`* (Book ${flags.inspectedBooks + 1}.)`]},
	
	{name: "tlk_spoilers", flag: "inspectedSpoilers", lines: [
		"* (It's a book containing secrets\n   about upcoming chapters.)",
		"* (The information seemes very,\n   very, intresting.)"]}
];

// Whichever of the above the player is stood in front of, or null.
function findInteraction() {
	for (const entry of interactions) {
		if (entry.name !== undefined) {
			if (amIFacing(entry.name))
				return entry;
			
			continue;
		}
		
		const tagged = objects.player.nearObjects.filter(
			s => objects[s].interactName == entry.interactName)[0];
		
		if (tagged && amIFacing(tagged))
			return entry;
	}
	
	return null;
}

function doKeyZ() {
	if (dialogueQueue.length) {
		if (dialogueQueue[0].length == 0) { // logic to continue to next dialgoue / dismiss
			dialogueQueue.shift();
			currentDialogue = "";
		}
		return;
	}
	
	// scan for interractables
	const entry = findInteraction();
	if (entry === null)
		return;
	
	for (const line of (entry.talk ? entry.talk() : entry.lines))
		dialogueQueue.push(line);
	
	if (entry.flag !== undefined)
		flags[entry.flag]++;
}

function doKeyX() {
	if (dialogueQueue.length) {
		if (dialogueQueue[0].length > 0) { // logic to skip current text crawl
            currentDialogue += dialogueQueue[0];
			dialogueQueue[0] = "";
        }
		return;
	}
}

function drawTextBox(x, y, w, h) {
	ctx.fillStyle = "white";
	ctx.fillRect(x, y, w, h);
	if (w > 6 && h > 6) {
		ctx.fillStyle = "black";
		ctx.fillRect(x+3, y+3, w-6, h-6);
	}
}

function drawText(text, x, y, s, align, target_ctx) {
	if (target_ctx == undefined)
		target_ctx = ctx;
	
	dt = [];
	floatingx = 0;
	
	for (var i = 0; i < text.length; i++) {
		c = text.charCodeAt(i);
		cx = c % 16;
		cy = Math.floor(c / 16);
		dt.push([c, cx, cy]);
		floatingx += 8 * s;
	}
	
	if (align == "right") x -= floatingx;
	else if (align == "center") x -= Math.floor(floatingx / 2);
	
	floatingx = 0;
	for (var i = 0; i < dt.length; i++) {
		[c, cx, cy] = dt[i];
		target_ctx.drawImage(
			font_eng,
			cx * 8, cy * 14,
			8, 14,
			x + floatingx, y,
			8 * s, 14 * s);
		floatingx += 8 * s;
	}
	return floatingx;
}

document.onkeydown = function (e) {
	e = e || window.event;
	regularInput(e, true);
};
document.onkeyup = function (e) {
	e = e || window.event;
	regularInput(e, false);
};
